<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// Post-processing removed: bloom caused shimmer on thin skip geometry (same class as SSAO).
// Native MSAA (antialias: true) is stable and sufficient.

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Configuration
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const FOGColor = 0xceccca;

// Tube radii — 45% thinner than v5 for architectural proportion
const R = { 1: 0.038, 2: 0.060, 3: 0.088 };

// X offset from center by resolution level
const LX = { 1: 8.0, 2: 5.5, 3: 3.5 };

// Stretched vertical spacing — doubles aspect ratio for vertebral feel
const SP = 2.0;
const TGAP = 2.4;

const R_TIP = 0.038;
const R_BOTTLENECK = 0.088;

// Geometry detail
const TUBE_SEGMENTS = 128;
const RADIAL_SEGMENTS = 10;
const SKIP_RADIAL = 8;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Scene
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(FOGColor);
scene.fog = new THREE.FogExp2(FOGColor, 0.006);

const camera = new THREE.PerspectiveCamera(
  32, window.innerWidth / window.innerHeight, 0.1, 300
);
camera.position.set(5, -2, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Minimal Environment Map — dark with controlled highlights
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const pmremGenerator = new THREE.PMREMGenerator(renderer);
pmremGenerator.compileEquirectangularShader();

const envScene = new THREE.Scene();
const envBg = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1, 1),
  new THREE.MeshBasicMaterial({ color: 0xd8d5d0, side: THREE.BackSide })
);
envBg.scale.setScalar(20);
envScene.add(envBg);

// Single subtle highlight panel for controlled anisotropic reflection
const envPanel = new THREE.Mesh(
  new THREE.PlaneGeometry(3, 2),
  new THREE.MeshBasicMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide })
);
envPanel.position.set(-5, 8, 8);
envPanel.lookAt(0, 0, 0);
envScene.add(envPanel);

const envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
pmremGenerator.dispose();
scene.environment = envMap;

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Controls — deliberate, museum-like
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.35;
controls.zoomSpeed = 0.6;
controls.panSpeed = 0.3;
controls.minDistance = 8;
controls.maxDistance = 120;
controls.target.set(3, -6, 0);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Lighting — single-source raking gallery light
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// Key: raking light from upper-left
const keyLight = new THREE.DirectionalLight(0xfff0dc, 1.4);
keyLight.position.set(-12, 10, 16);
scene.add(keyLight);

// Fill: cool counter
const fillLight = new THREE.DirectionalLight(0xd0daf0, 0.25);
fillLight.position.set(10, -4, -8);
scene.add(fillLight);

// Rim: subtle edge definition
const rimLight = new THREE.DirectionalLight(0xc8daff, 0.18);
rimLight.position.set(6, 10, -18);
scene.add(rimLight);

// Hemisphere: warm sky / cool ground
const hemiLight = new THREE.HemisphereLight(0xf0ece6, 0xc8d0da, 0.12);
scene.add(hemiLight);

// Ambient
scene.add(new THREE.AmbientLight(0xf0edea, 0.08));

// Subtle uplight pool from below
const uplight = new THREE.PointLight(0xd8dce4, 0.3, 50);
scene.add(uplight); // positioned after MID_Y computed

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Materials — anisotropic metallic tubes, matte soma, emissive brass skips
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// Channel-to-strand mapping: each physical strand represents ~64 channels (= 1 attention head)
const CH_TO_STRANDS = { 320: 5, 640: 10, 1280: 20 };

// Sub-channel count within each physical strand (for shader texture)
const SUB_CHANNELS_PER_STRAND = 8;

// Create arm material with sub-channel shader striations
function createArmMat(color, roughness = 0.40, metalness = 0.65) {
  return new THREE.MeshPhysicalMaterial({
    color,
    roughness,
    metalness,
    anisotropy: 0.8,
    anisotropyRotation: 0,
    envMapIntensity: 0.30,
  });
}

// Per-level materials are now created dynamically per-strand via createStrandMats() in buildLevelTube().
// Each strand (= 1 attention head) gets its own material for independent head-activation coloring.

// Soma (junction spheres) — matte ceramic, no anisotropy
// Per-block materials are created individually in the somaMeshes section below.

// Skip connection base material — warm brass, emissive
// Individual instances created per skip connection for animated emission
function createSkipMat(phase) {
  return new THREE.MeshPhysicalMaterial({
    color: 0xe8bd73,
    roughness: 0.30,
    metalness: 0.6,
    anisotropy: 0.6,
    anisotropyRotation: 0,
    envMapIntensity: 0.15,
    emissive: 0xe8bd73,
    emissiveIntensity: 0.18,
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Cable Striation Shader — longitudinal strands hinting at channel structure
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// Injects longitudinal striations into MeshPhysicalMaterial tubes.
// strandMin/strandMax: strand count varies along tube (UV.x = 0→1)
// intensity: how much darker the valleys between strands are (0.0→1.0)
function addCableStriations(mat, strandMin, strandMax, intensity = 0.08) {
  const shaderRef = { value: null }; // store compiled shader for uniform updates
  mat.defines = mat.defines || {};
  mat.defines.USE_UV = '';
  mat.onBeforeCompile = (shader) => {
    const originalFS = shader.fragmentShader;
    shaderRef.value = shader;
    shader.uniforms.u_strandMin = { value: strandMin };
    shader.uniforms.u_strandMax = { value: strandMax };
    shader.uniforms.u_strandIntensity = { value: intensity };
    shader.uniforms.u_progress = { value: -1.0 }; // Phase C: signal flow (inactive = -1)
    shader.uniforms.u_progressOffset = { value: 0.0 }; // Per-strand timing offset (0→0.15) for wave effect
    shader.uniforms.u_headActivation = { value: 0.0 }; // Per-head activation intensity (0=inactive)
    shader.uniforms.u_headColor = { value: new THREE.Color(0.91, 0.74, 0.45) }; // Per-head color (warm default)
    shader.uniforms.u_blockStart = { value: 0.0 }; // Tube position where current block starts (head color clip)
    shader.uniforms.u_subStrands = { value: 8.0 }; // Sub-channel count within this strand (GroupNorm groups)

    // Forward UV from vertex → fragment via custom varying
    shader.vertexShader = shader.vertexShader.replace(
      'void main() {',
      'varying vec2 vTubeUv;\nvoid main() {\n  vTubeUv = uv;'
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      'void main() {',
      [
        'varying vec2 vTubeUv;',
        'uniform float u_strandMin;',
        'uniform float u_strandMax;',
        'uniform float u_strandIntensity;',
        'uniform float u_progress;',
        'uniform float u_progressOffset;',
        'uniform float u_headActivation;',
        'uniform vec3 u_headColor;',
        'uniform float u_blockStart;',
        'uniform float u_subStrands;',
        'void main() {'
      ].join('\n')
    );

    // After color_fragment: modulate diffuseColor with striations + signal flow + head activation
    shader.fragmentShader = shader.fragmentShader.replace(
      /\s*#include <color_fragment>/,
      `\n      #include <color_fragment>
      // === Primary channel texture (attention head level) ===
      // vTubeUv.y = around circumference (0→1), vTubeUv.x = along length (0→1)
      float sc = mix(u_strandMin, u_strandMax, vTubeUv.x);
      float circumStrand = sin(vTubeUv.y * sc * 6.28318) * 0.5 + 0.5;

      // === Sub-channel detail (GroupNorm groups within each head) ===
      // Higher-frequency pattern: ~8 micro-strands per tube, visible on zoom
      float subStrand = sin(vTubeUv.y * u_subStrands * 6.28318) * 0.5 + 0.5;
      // Longitudinal texture (subtle fiber grain)
      float lengthGrain = sin(vTubeUv.x * 300.0) * 0.5 + 0.5;

      // Combine: primary strands (60%) + sub-channel detail (25%) + longitudinal grain (15%)
      float combinedStrand = circumStrand * 0.60 + subStrand * 0.25 + lengthGrain * 0.15;
      float strandMask = mix(1.0 - u_strandIntensity, 1.0, combinedStrand);
      diffuseColor.rgb *= strandMask;

      // === Per-strand signal flow with timing offset ===
      // Each strand's progress is shifted by u_progressOffset, creating a wave cascade.
      // The signal is a NARROW BRIGHT PULSE traveling along the tube, with a dim
      // afterglow behind it. This makes the wave cascade between strands visible.
      float strandProgress = u_progress - u_progressOffset;
      if (strandProgress > 0.001) {
        float pos = vTubeUv.x;

        // Per-head activation coloring — only in current block's tube segment
        // u_blockStart clips the head color to start at the current block boundary
        if (u_headActivation > 0.0) {
          float headMask = step(u_blockStart, pos) * step(pos, strandProgress + 0.01);
          diffuseColor.rgb = mix(diffuseColor.rgb, u_headColor, u_headActivation * 0.6 * headMask);
        }

        float dist = pos - strandProgress;

        // Narrow traveling pulse (triangular, ±0.10 around the signal front)
        float pulse = clamp(1.0 - abs(dist) * 10.0, 0.0, 1.0) * 2.4;

        // Afterglow for visited region (behind the front, fades toward tube start)
        float behindMask = step(pos, strandProgress + 0.01);
        float trailFade = clamp(pos / max(strandProgress, 0.001), 0.0, 1.0);
        float trail = behindMask * mix(0.10, 0.35, trailFade);

        float glow = pulse + trail;
        float headGlowClip = step(u_blockStart, pos) * step(0.001, u_headActivation);
        vec3 glowColor = mix(vec3(0.91, 0.74, 0.45), u_headColor, headGlowClip);
        diffuseColor.rgb += glowColor * glow;
      }
      `
    );

    // Position-dependent emissive: only the filled portion of the tube glows.
    // This replaces the old material-level emissive which lit the WHOLE tube mesh.
    // Injected after emissivemap_fragment so totalEmissiveRadiance is already initialized.
    shader.fragmentShader = shader.fragmentShader.replace(
      /\s*#include <emissivemap_fragment>/,
      `\n      #include <emissivemap_fragment>
      // === Position-dependent signal emissive ===
      // Ambient baseline: dim warm glow so tubes aren't completely flat at rest.
      totalEmissiveRadiance += vec3(0.04, 0.03, 0.02);

      // Signal glow: only the region BEHIND the signal front gets warm emissive.
      float spE = u_progress - u_progressOffset;
      if (spE > 0.001) {
        float posE = vTubeUv.x;
        float behindE = step(posE, spE + 0.01);
        float fadeE = clamp(posE / max(spE, 0.001), 0.0, 1.0);
        // Narrow bright pulse at signal front + wider trail behind
        float distE = posE - spE;
        float pulseE = clamp(1.0 - abs(distE) * 8.0, 0.0, 1.0) * 1.2;
        float trailE = behindE * mix(0.15, 0.50, fadeE);
        float emGlow = pulseE + trailE;
        float headEmClip = step(u_blockStart, posE) * step(0.001, u_headActivation);
        vec3 emCol = mix(vec3(0.91, 0.74, 0.45), u_headColor, headEmClip);
        totalEmissiveRadiance += emCol * emGlow;
      }
      `
    );
    if (shader.fragmentShader === originalFS) {
      console.warn('[addCableStriations] Shader injection FAILED — #include replacements did not match. Check Three.js version.');
    }
  };
  mat.userData.shaderRef = shaderRef;
  return mat;
}

// Striations are now applied per-strand in createStrandMats() during tube construction.

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Block Placement — identical topology, stretched proportions
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const blocks = [];
const posMap = new Map();

function addBlock(name, label, ch, res, level, side, x, y, isSample = false) {
  const pos = new THREE.Vector3(x, y, 0);
  blocks.push({ name, label, ch, res, level, side, pos, isSample });
  posMap.set(name, pos);
}

const L1_TOP = 8;

// Encoder L1
addBlock('input_blocks.0',   'Conv In',             320, '104x152', 1, 'encoder', -LX[1], L1_TOP);
addBlock('input_blocks.1.0', 'ResBlock + SelfAttn',  320, '104x152', 1, 'encoder', -LX[1], L1_TOP - SP);
addBlock('input_blocks.2.0', 'ResBlock + SelfAttn',  320, '104x152', 1, 'encoder', -LX[1], L1_TOP - 2*SP);

// Decoder L1
addBlock('output_blocks.8.0', 'Conv Out',            320, '104x152', 1, 'decoder', LX[1], L1_TOP);
addBlock('output_blocks.7',   'ResBlock + SelfAttn', 320, '104x152', 1, 'decoder', LX[1], L1_TOP - SP);
addBlock('output_blocks.6',   'ResBlock + SelfAttn', 320, '104x152', 1, 'decoder', LX[1], L1_TOP - 2*SP);
addBlock('output_blocks.5.1', 'ResBlock + SelfAttn', 320, '104x152', 1, 'decoder', LX[1], L1_TOP - 3*SP);

// Transition 1->2
const DS12_Y = L1_TOP - 2*SP - TGAP;
const US21_Y = L1_TOP - 3*SP - TGAP;

addBlock('input_blocks.3',    'Downsample', 640, '52x76', 1, 'encoder',
  (-LX[1] + -LX[2]) * 0.5, DS12_Y, true);
addBlock('output_blocks.5.0', 'Upsample',   320, '104x152', 1, 'decoder',
  (LX[1] + LX[2]) * 0.5, US21_Y, true);

// Level 2 band
const L2_TOP = Math.min(DS12_Y, US21_Y) - TGAP * 0.6;

// Encoder L2
addBlock('input_blocks.4.0', 'ResBlock + CrossAttn', 640, '52x76', 2, 'encoder', -LX[2], L2_TOP);
addBlock('input_blocks.4.1', 'ResBlock + CrossAttn', 640, '52x76', 2, 'encoder', -LX[2], L2_TOP - SP);
addBlock('input_blocks.5.0', 'ResBlock + CrossAttn', 640, '52x76', 2, 'encoder', -LX[2], L2_TOP - 2*SP);
addBlock('input_blocks.5.1', 'ResBlock + CrossAttn', 640, '52x76', 2, 'encoder', -LX[2], L2_TOP - 3*SP);

// Decoder L2
addBlock('output_blocks.4.1', 'ResBlock + CrossAttn', 640, '52x76', 2, 'decoder', LX[2], L2_TOP);
addBlock('output_blocks.4.0', 'ResBlock + CrossAttn', 640, '52x76', 2, 'decoder', LX[2], L2_TOP - SP);
addBlock('output_blocks.3.1', 'ResBlock + CrossAttn', 640, '52x76', 2, 'decoder', LX[2], L2_TOP - 2*SP);
addBlock('output_blocks.3.0', 'ResBlock + CrossAttn', 640, '52x76', 2, 'decoder', LX[2], L2_TOP - 3*SP);

// Tapered Tube Geometry with Tangent Attribute
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function createTaperedTube(curve, segments, radiusFn, radialSegments) {
  const frames = curve.computeFrenetFrames(segments, false);
  const vertices = [];
  const normals = [];
  const tangentData = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const position = curve.getPointAt(t);
    const radius = radiusFn(t);
    const N = frames.normals[i];
    const B = frames.binormals[i];
    const T = frames.tangents[i];

    for (let j = 0; j <= radialSegments; j++) {
      const v = (j / radialSegments) * Math.PI * 2;
      const sin = Math.sin(v);
      const cos = -Math.cos(v);
      const nx = cos * N.x + sin * B.x;
      const ny = cos * N.y + sin * B.y;
      const nz = cos * N.z + sin * B.z;
      normals.push(nx, ny, nz);
      vertices.push(
        position.x + radius * nx,
        position.y + radius * ny,
        position.z + radius * nz
      );
      tangentData.push(T.x, T.y, T.z, 1.0);
      uvs.push(t, j / radialSegments);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * (radialSegments + 1) + j;
      const b = (i + 1) * (radialSegments + 1) + j;
      const c = (i + 1) * (radialSegments + 1) + (j + 1);
      const d = i * (radialSegments + 1) + (j + 1);
      indices.push(a, b, d, b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setIndex(indices);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('tangent', new THREE.Float32BufferAttribute(tangentData, 4));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  return geo;
}

function smoothstep(t) {
  const x = Math.max(0, Math.min(1, t));
  return x * x * (3 - 2 * x);
}

/**
 * Create a bundle of N thinner tubes arranged around a central curve.
 * Visually represents multiple channels flowing through the connection.
 *
 * @param {THREE.CatmullRomCurve3} curve - Central curve of the bundle
 * @param {number} segments - Longitudinal segments per strand
 * @param {Function} radiusFn - Bundle radius function f(t) → radius
 * @param {number} numStrands - Number of strands in the bundle
 * @param {number} radialSegments - Radial segments per strand cross-section
 * @returns {THREE.BufferGeometry[]} Array of strand geometries
 */
function createCableBundle(curve, segments, radiusFn, numStrands, radialSegments) {
  const frames = curve.computeFrenetFrames(segments, false);
  const geometries = [];

  for (let s = 0; s < numStrands; s++) {
    const angle = (s / numStrands) * Math.PI * 2;
    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);

    // Strand spacing: strands spread wide enough to be clearly separate cables.
    // Ring radius dynamic along tube: tighter at nodes (t=0,1), wider between them.
    // This gives the bundle a "breathing" organic look and maximizes visibility.
    const MIN_STRAND_R = 0.008;
    const GAP_RATIO = 0.6; // 60% gap between strands
    const rawStrandR = Math.max(MIN_STRAND_R, radiusFn(0.5) * 0.22);
    const baseRing = numStrands * rawStrandR * (2 + GAP_RATIO) / (2 * Math.PI);
    const strandRadiusScale = rawStrandR / Math.max(0.001, radiusFn(0.5));

    const offsetPoints = [];
    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      const basePos = curve.getPointAt(t);
      const N = frames.normals[i];
      const B = frames.binormals[i];

      // Dynamic ring radius: 1.0× at endpoints, 1.6× at midpoints between nodes
      // Creates a visible "bulge" where strands spread apart between blocks
      const bulge = 1.0 + 0.6 * Math.sin(t * Math.PI);
      const offsetR = baseRing * bulge;

      offsetPoints.push(new THREE.Vector3(
        basePos.x + offsetR * (cosA * N.x + sinA * B.x),
        basePos.y + offsetR * (cosA * N.y + sinA * B.y),
        basePos.z + offsetR * (cosA * N.z + sinA * B.z)
      ));
    }

    const strandCurve = new THREE.CatmullRomCurve3(offsetPoints, false, 'centripetal');
    const strandRadiusFn = (t) => radiusFn(t) * strandRadiusScale;
    geometries.push(createTaperedTube(strandCurve, segments, strandRadiusFn, radialSegments));
  }

  return geometries;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Deterministic pseudo-random
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return h;
}

function seededOffset(seed, idx) {
  const h = hashStr(seed + '_' + idx);
  return ((h & 0xFFFF) / 0xFFFF) * 2 - 1;
}

// Spline Construction
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function insertJitterPoints(blockNames) {
  const rawPoints = blockNames.map(name => posMap.get(name).clone());
  const jittered = [rawPoints[0]];
  for (let i = 0; i < rawPoints.length - 1; i++) {
    const a = rawPoints[i];
    const b = rawPoints[i + 1];
    const seed = blockNames[i] + '_jit_' + blockNames[i + 1];
    const mid = new THREE.Vector3(
      (a.x + b.x) * 0.5 + seededOffset(seed, 0) * 0.03,
      (a.y + b.y) * 0.5,
      (a.z + b.z) * 0.5 + seededOffset(seed, 2) * 0.04
    );
    jittered.push(mid);
    jittered.push(b);
  }
  return jittered;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Radius functions
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const encTipFraction = 1.0 / (encoderPoints.length - 1);

function encoderRadiusFn(t) {
  if (t < encTipFraction) {
    return 0.005 + (R_TIP - 0.005) * smoothstep(t / encTipFraction);
  }
  const bodyT = (t - encTipFraction) / (1.0 - encTipFraction);
  return R_TIP + (R_BOTTLENECK - R_TIP) * smoothstep(bodyT);
}

const decTipFraction = 1.0 / (decoderPoints.length - 1);

function decoderRadiusFn(t) {
  const tipStart = 1.0 - decTipFraction;
  if (t > tipStart) {
    return R_TIP + (0.005 - R_TIP) * smoothstep((t - tipStart) / decTipFraction);
  }
  const bodyT = t / tipStart;
  return R_BOTTLENECK + (R_TIP - R_BOTTLENECK) * smoothstep(bodyT);
}

function middleRadiusFn() { return R_BOTTLENECK; }

// Create per-strand materials for a level segment
// level: 1/2/3 — determines sub-channel count (GroupNorm groups per head)
// SDXL GroupNorm: always 32 groups. Sub-strands per head = 32 / numHeads
//   L1: 32/5 ≈ 6, L2: 32/10 ≈ 3, L3: 32/20 ≈ 2
// We use visual multiplier for readable detail: actual × 2
const LEVEL_SUB_STRANDS = { 1: 12, 2: 6, 3: 4 };

function createStrandMats(baseColor, numStrands, intensity = 0.30, level = 2) {
  const mats = [];
  const subStrands = LEVEL_SUB_STRANDS[level] || 8;
  for (let i = 0; i < numStrands; i++) {
    const mat = createArmMat(baseColor);
    addCableStriations(mat, numStrands, numStrands, intensity);
    // Set sub-channel count after shader compilation
    const origOnBeforeCompile = mat.onBeforeCompile;
    mat.onBeforeCompile = (shader, renderer) => {
      origOnBeforeCompile(shader, renderer);
      shader.uniforms.u_subStrands.value = subStrands;
    };
    mats.push(mat);
  }
  return mats;
}

// Build a per-level tube bundle
function buildLevelTube(key, blockNames, numStrands, baseColor, tipExtStart, tipExtEnd, intensity = 0.30, level = 2) {
  // Register blocks in level map
  blockNames.forEach((name, i) => {
    blockLevelMap.set(name, { levelKey: key, localIndex: i, localTotal: blockNames.length });
  });

  // Create per-strand materials (pass level for sub-channel count)
  const mats = createStrandMats(baseColor, numStrands, intensity, level);

  // Build curve points with jitter
  const points = [];
  if (tipExtStart) points.push(tipExtStart);
  const jittered = insertJitterPoints(blockNames);
  points.push(...jittered);
  if (tipExtEnd) points.push(tipExtEnd);

  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');

  // Level radius (constant within level)
  const block = blocks.find(b => b.name === blockNames[0]);
  const levelR = R[block?.level] || R[2];

  // Radius function: constant for body, with taper at tips
  let radiusFn;
  if (tipExtStart) {
    const tipFrac = 1.0 / (points.length - 1);
    radiusFn = (t) => {
      if (t < tipFrac) return 0.005 + (levelR - 0.005) * smoothstep(t / tipFrac);
      return levelR;
    };
  } else if (tipExtEnd) {
    const tipFrac = 1.0 / (points.length - 1);
    radiusFn = (t) => {
      if (t > 1.0 - tipFrac) return levelR + (0.005 - levelR) * smoothstep((t - (1.0 - tipFrac)) / tipFrac);
      return levelR;
    };
  } else {
    radiusFn = () => levelR;
  }

  // Create cable bundle
  const segments = Math.max(36, blockNames.length * 16);
  const geos = createCableBundle(curve, segments, radiusFn, numStrands, STRAND_RADIAL);

  const meshes = [];
  geos.forEach((geo, i) => {
    const mesh = new THREE.Mesh(geo, mats[i]);
    meshes.push(mesh);
    group.add(mesh);
  });

  levelTubes[key] = { meshes, mats, strands: numStrands, level: block?.level || 3 };
  return { curve, meshes, mats };
}

// Build transition tube between levels (short connecting segment)
function buildTransitionTube(fromBlock, toBlock, numStrands, baseColor) {
  const p1 = posMap.get(fromBlock);
  const p2 = posMap.get(toBlock);
  if (!p1 || !p2) return [];

  const ctrl = new THREE.Vector3(
    (p1.x + p2.x) * 0.5,
    Math.min(p1.y, p2.y) - 0.8,
    0
  );
  const curve = new THREE.CatmullRomCurve3([p1.clone(), ctrl, p2.clone()], false, 'centripetal');

  // Use destination level's radius
  const block = blocks.find(b => b.name === toBlock);
  const levelR = R[block?.level] || R[2];

  const mats = createStrandMats(baseColor, numStrands, 0.25);
  const geos = createCableBundle(curve, 36, () => levelR, numStrands, STRAND_RADIAL);

  const meshes = [];
  geos.forEach((geo, i) => {
    const mesh = new THREE.Mesh(geo, mats[i]);
    meshes.push(mesh);
    group.add(mesh);
  });

  return { meshes, mats };
}

  { enc: 'input_blocks.3',   dec: 'output_blocks.5.0', level: 1 },  // Downsample→Upsample L1↔L2

const skipMeshes = [];

skipPairs.forEach(({ enc, dec, level }, idx) => {
  const p1 = posMap.get(enc);
  const p2 = posMap.get(dec);
  if (!p1 || !p2) return;

  // Skip radius = 0.3x main tube radius
  const branchR = R[level];
  const skipR = Math.max(0.018, branchR * 0.30);
  const seed = enc + '_skip_' + dec;

  const zFwd = 0.8 + (3 - level) * 0.5 + idx * 0.05;
  const span = Math.abs(p2.x - p1.x);
  const sag = -(0.06 + seededOffset(seed, 7) * 0.03) * span;

  const ctrl = new THREE.Vector3(
    (p1.x + p2.x) * 0.5 + seededOffset(seed, 4) * 0.25,
    (p1.y + p2.y) * 0.5 + sag + seededOffset(seed, 5) * 0.15,
    Math.max(p1.z, p2.z) + zFwd
  );

  const curve = new THREE.QuadraticBezierCurve3(p1.clone(), ctrl, p2.clone());

  const skipRadiusFn = (t) => {
    // Taper to zero at both ends — tube emerges from/merges into block spheres cleanly
    return skipR * Math.sin(t * Math.PI);
  };

  const geo = createTaperedTube(curve, 48, skipRadiusFn, SKIP_RADIAL);
  const mat = createSkipMat(idx);
  skipMats.push(mat);
  const mesh = new THREE.Mesh(geo, mat);
  skipMeshes.push(mesh);
  group.add(mesh);
});

  const c = document.createElement('canvas');

  c.width = 512; c.height = 96;

  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 48);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity, depthTest: true, depthWrite: false });
  const s = new THREE.Sprite(mat);
  s.scale.set(4.5, 0.85, 1);
  return s;
}

function updateCrossAttention() {
  // Drive the cross-attention arcs from each SpatialTransformer block's OUTPUT MAGNITUDE
  // (output_norm) at this timestep. Brighter arc = larger output-feature magnitude at that
  // attention-bearing block (residual included — a coarse activity proxy, not isolated
  // cross-attention, and not a per-token attention-weight map).
  const attnTs = currentVizData?.attn_summaries?.[currentTimestep];

  // No data for this timestep: hide the arcs and prompt field, and reset any replay-flash color.
  if (!attnTs) {
    attnLines.forEach(({ material }) => {
      material.opacity = 0.0;
      material.color.setHex(0xe8bd73);
    });
    promptFieldMat.opacity = 0.0;
    promptLbl.material.opacity = 0.0;
    return;
  }

  // Collect output_norm across the cross-attention blocks present this timestep.
  const norms = [];
  attnLines.forEach((_entry, blockName) => {
    const n = attnTs[blockName]?.output_norm;
    if (typeof n === 'number' && isFinite(n)) norms.push(n);
  });
  const minN = norms.length ? Math.min(...norms) : 0;
  const maxN = norms.length ? Math.max(...norms) : 1;
  const range = maxN - minN;

  // Map each block's magnitude to arc opacity (min-max normalized per timestep).
  const OP_MIN = 0.22, OP_MAX = 0.9;
  attnLines.forEach(({ material }, blockName) => {
    const n = attnTs[blockName]?.output_norm;
    material.color.setHex(0xe8bd73); // reset any replay-flash color
    if (typeof n !== 'number' || !isFinite(n)) {
      material.opacity = OP_MIN;
      return;
    }
    const t = range > 0 ? (n - minN) / range : 0.5;
    material.opacity = OP_MIN + t * (OP_MAX - OP_MIN);
  });

  // Keep the prompt field line + label persistently visible whenever data is loaded.
  promptFieldMat.opacity = 0.35;
  promptFieldMat.color.setHex(0xc8a868); // reset replay-flash color
  promptLbl.material.opacity = 0.6;
}

  'input_blocks.6':   'input_blocks.6.0',  // Downsample

};

function vizToProfileName(vizName) {
  if (vizName in VIZ_TO_PROFILE) return VIZ_TO_PROFILE[vizName];
  return vizName; // direct match for most blocks
}

// Color ramp: cold near-black → hot bright brass with glow
const COLOR_COLD = new THREE.Color(0x2a2e38);  // near-black: unmistakably "off"
const COLOR_HOT  = new THREE.Color(0xf0c855);  // bright warm gold
const EMISSIVE_HOT = new THREE.Color(0xe8bd73);

function activationColor(normalizedValue) {
  const t = Math.max(0, Math.min(1, normalizedValue));
  const color = COLOR_COLD.clone().lerp(COLOR_HOT, t);
  // Emissive glow ramps continuously from 0 — every block shows its magnitude
  // Low activation: barely visible. High activation: bright self-illumination.
  const emissiveIntensity = t * t * 2.2;  // quadratic glow: low blocks stay matte, hot blocks self-illuminate strongly
  return { color, emissiveIntensity };
}

// State
let vizIndex = null;
let currentVizData = null;
let currentTimestep = null;
let currentProfileKey = null;
let loadAbortController = null;

// Data path base (relative to HTML file location)
const DATA_BASE = 'activation-mapping/';

async function loadIndex() {
  try {
    const resp = await fetch(DATA_BASE + 'profiles/viz/index.json');
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    vizIndex = await resp.json();
    console.log(`Loaded index: ${vizIndex.profiles.length} profiles`);
    return vizIndex;
  } catch (e) {
    console.warn('Could not load viz index:', e.message);
    return null;
  }
}

async function loadProfile(profileKey) {
  // Abort any in-flight profile load
  if (loadAbortController) loadAbortController.abort();
  loadAbortController = new AbortController();
  const { signal } = loadAbortController;

  try {
    // Use viz_json path from index when available
    let url = DATA_BASE + `profiles/viz/${profileKey}.viz.json`;
    if (vizIndex) {
      const profileInfo = vizIndex.profiles.find(p => p.key === profileKey);
      if (profileInfo?.viz_json) {
        url = DATA_BASE + profileInfo.viz_json.replace(/^activation-mapping\//, '');
      }
    }

    const resp = await fetch(url, { signal, cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    currentVizData = await resp.json();
    currentProfileKey = profileKey;

    // Set initial timestep (middle of range)
    const steps = currentVizData.timesteps;
    currentTimestep = String(steps[Math.floor(steps.length / 2)]);
    console.log(`Loaded profile: ${profileKey} (${steps.length} timesteps)`);

    updateBlockColors();
    updateCrossAttention();
    if (typeof updateCfgToggleVisibility === 'function') updateCfgToggleVisibility();
    updateUI();
    return currentVizData;
  } catch (e) {
    if (e.name === 'AbortError') return null; // superseded by newer load
    console.warn('Could not load profile:', e.message);
    // Reset to no-data state, show static cross-attention indicators
    updateCrossAttention();
    return null;
  }
}

function updateBlockColors() {
  if (!currentVizData || !currentTimestep) return;

  const blockData = currentVizData.blocks[currentTimestep];
  if (!blockData) {
    console.warn('No block data for timestep', currentTimestep);
    return;
  }

  // CFG view mode: use different data source for coloring
  const cfgData = currentVizData?.cfg_split?.[currentTimestep];
  const useCfgMode = typeof cfgViewMode !== 'undefined' && cfgViewMode !== 'merged' && cfgData;

  // Get normalization bounds for this timestep
  const normBounds = currentVizData.normalization.per_step[currentTimestep]
    || currentVizData.normalization.global;
  const p5 = normBounds.p5;
  const p95 = normBounds.p95;
  const range = p95 - p5;

  // For CFG modes, compute dynamic normalization
  let cfgValues = [];
  if (useCfgMode) {
    Object.values(cfgData).forEach(s => {
      if (cfgViewMode === 'cond') cfgValues.push(Math.log1p(s.cond_norm || 0));
      else if (cfgViewMode === 'uncond') cfgValues.push(Math.log1p(s.uncond_norm || 0));
      else if (cfgViewMode === 'delta') cfgValues.push(Math.log1p(s.cfg_divergence || 0));
    });
    cfgValues.sort((a, b) => a - b);
  }
  const cfgP5 = cfgValues.length > 0 ? cfgValues[Math.floor(cfgValues.length * 0.05)] : 0;
  const cfgP95 = cfgValues.length > 0 ? cfgValues[Math.floor(cfgValues.length * 0.95)] : 1;
  const cfgRange = cfgP95 - cfgP5;

  let mapped = 0, unmapped = 0;

  somaMeshes.forEach((mesh, vizName) => {
    const profileName = vizToProfileName(vizName);
    if (!profileName || !blockData[profileName]) {
      mesh.material.color.copy(COLOR_COLD);
      mesh.material.emissive.setHex(0x000000);
      mesh.material.emissiveIntensity = 0;
      unmapped++;
      return;
    }

    let logNorm, normP5, normRange;

    if (useCfgMode && cfgData[profileName]) {
      const cfgStats = cfgData[profileName];
      if (cfgViewMode === 'cond') logNorm = Math.log1p(cfgStats.cond_norm || 0);
      else if (cfgViewMode === 'uncond') logNorm = Math.log1p(cfgStats.uncond_norm || 0);
      else if (cfgViewMode === 'delta') logNorm = Math.log1p(cfgStats.cfg_divergence || 0);
      normP5 = cfgP5;
      normRange = cfgRange;
    } else {
      const stats = blockData[profileName];
      logNorm = stats.log_norm ?? Math.log1p(stats.norm ?? 0);
      normP5 = p5;
      normRange = range;
    }

    const normalized = normRange > 0 ? (logNorm - normP5) / normRange : 0.5;
    const clamped = Math.max(0, Math.min(1, isFinite(normalized) ? normalized : 0));

    const { color, emissiveIntensity } = activationColor(clamped);
    mesh.material.color.copy(color);
    mesh.material.emissive.copy(EMISSIVE_HOT);
    mesh.material.emissiveIntensity = emissiveIntensity;
    mapped++;
  });
}

// Wire up UI elements

['pointerdown', 'wheel'].forEach(evt => {

imagePanel.addEventListener('click', () => {

    overlayImg.src = intermediateImg.src;
    imageOverlay.classList.add('active');
  }
});
overlayClose.addEventListener('click', (e) => {

imageOverlay.addEventListener('click', () => {

});

});

// Step slider
stepSlider.addEventListener('input', () => {
  if (!currentVizData) return;
  const stepNum = parseInt(stepSlider.value);

  const available = currentVizData.timesteps;
  let closest = available[0];
  let closestDist = Math.abs(stepNum - closest);
  for (const ts of available) {
    const dist = Math.abs(stepNum - ts);
    if (dist < closestDist) { closest = ts; closestDist = dist; }
  }

  currentTimestep = String(closest);
  // Reset block position when changing step
  if (activeBlockIndex >= 0) {
    setReplayCursor(0, 0);
    updateBlockSlider();
    updateBlockImage(fullSequence[0]);
  } else {
    setReplayCursor(-1, 0);
  }
  updateBlockColors();
  updateCrossAttention();
  if (typeof updateExpansionColors === 'function') updateExpansionColors();
  if (typeof updatePcaBrainScan === 'function') updatePcaBrainScan();
  updateUI();
});

// Block slider — scrub within-step block position
blockSlider.addEventListener('input', () => {
  const idx = parseInt(blockSlider.value);
  setReplayCursor(idx, 0);
  updateBlockSlider();
  // Update per-block image when scrubbing
  if (activeBlockIndex >= 0 && activeBlockIndex < fullSequence.length) {
    updateBlockImage(fullSequence[activeBlockIndex]);
  }
  // Pause autoplay when manually scrubbing
  if (isPlaying) {
    isPlaying = false;
    updatePlayButton();
  }
});

// Play/Pause button
playBtn.addEventListener('click', () => {
  if (!currentVizData) return;

  isPlaying = !isPlaying;
  if (isPlaying) {
    // Start from beginning if at end or no block selected
    if (activeBlockIndex < 0 || activeBlockIndex >= fullSequence.length - 1) {
      setReplayCursor(0, 0);
      updateBlockImage(fullSequence[0]);
    }
    lastPlayTime = performance.now() / 1000;
  }
  updatePlayButton();
  updateBlockSlider();
});

function updateBlockSlider() {

// Stop replay — called when changing profiles
function stopReplay() {
  isPlaying = false;
  activeBlockIndex = -1;
  updatePlayButton();
  updateBlockSlider();
  clearSignalPulse();
}

profileSelect.addEventListener('change', () => {

function updateUI() {
  if (!currentVizData) return;

  // Refresh detail panel if a block is selected
  if (selectedBlockName) updateDetailPanel();

  // Step label
  stepLabel.textContent = `Step ${currentTimestep}`;

  // Slider position
  stepSlider.value = parseInt(currentTimestep);
  stepSlider.min = Math.min(...currentVizData.timesteps);
  stepSlider.max = Math.max(...currentVizData.timesteps);

  // Info panel + hero label
  const meta = currentVizData.metadata;
  if (meta) {
    infoCharacter.textContent = `${meta.char || ''} / ${meta.pose || ''}`;
    infoPrompt.textContent = meta.prompt || '';
    // Update hero label
    const heroLabel = document.querySelector('.tl');
    heroLabel.innerHTML = `U-NET ARCHITECTURE / <strong>${(meta.char || '').toUpperCase()}</strong> / ${(meta.pose || '').toUpperCase()}` +
      `<br><span style="font-size:7px;opacity:0.6;display:inline-block;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;">${meta.prompt || ''}</span>`;
  }

  // Intermediate image
  if (vizIndex) {
    const profile = vizIndex.profiles.find(p => p.key === currentProfileKey);
    const stripBase = (path) => path ? DATA_BASE + path.replace(/^activation-mapping\//, '') : null;

    // Pick image source based on CFG view mode
    const cfgMode = typeof cfgViewMode !== 'undefined' ? cfgViewMode : 'merged';
    const imgKey = cfgMode === 'cond' ? 'intermediates_cond'
                 : cfgMode === 'uncond' ? 'intermediates_uncond'
                 : 'intermediates';
    const cfgImgPath = profile?.images?.[imgKey]?.[currentTimestep];
    const fallbackPath = profile?.images?.intermediates?.[currentTimestep];
    const imgPath = cfgImgPath || fallbackPath;

    if (profile?.has_intermediates && imgPath) {
      intermediateImg.src = stripBase(imgPath);
      intermediateImg.onload = () => { imagePanel.style.display = 'block'; };
      intermediateImg.onerror = () => {
        // Fall back to merged image if cond/uncond not available
        if (imgKey !== 'intermediates' && fallbackPath) {
          intermediateImg.src = stripBase(fallbackPath);
        } else {
          imagePanel.style.display = 'none';
        }
      };
      const modeLabel = cfgMode !== 'merged' ? ` (${cfgMode})` : '';
      imageCaption.textContent = `step ${currentTimestep}${modeLabel}`;
    } else if (profile?.images?.final) {
      intermediateImg.src = stripBase(profile.images.final);
      intermediateImg.onload = () => { imagePanel.style.display = 'block'; };
      intermediateImg.onerror = () => { imagePanel.style.display = 'none'; };
      imageCaption.textContent = 'final';
    } else {
      imagePanel.style.display = 'none';
    }
  }

  // Update comparison mode if active
  if (compareActive) {
    updateCompareImageB();
    updateCompareColors();
  }
}

function populateProfileSelector() {
  if (!vizIndex) return;
  profileSelect.innerHTML = '';
  vizIndex.profiles.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.key;
    opt.textContent = `${p.character} / ${p.pose}`;
    profileSelect.appendChild(opt);
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Default grey state — shown before any profile data loads
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function setAllBlocksGrey() {

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Init: load data, then start render loop
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

async function initData() {
  const index = await loadIndex();
  if (index && index.profiles.length > 0) {
    populateProfileSelector();
    // Load first profile
    await loadProfile(index.profiles[0].key);
