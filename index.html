// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Signal Pulse + Trail Rendering
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const PULSE_COLOR = new THREE.Color(0xffffff);
const PULSE_EMISSIVE = new THREE.Color(0xe8bd73);
const DIM_COLOR = new THREE.Color(0x3a3e48);
const TRAIL_DEPTH = 8; // how many blocks back the warm trail extends

// Smooth block transition: 0→1 float interpolating between blocks
let blockTransition = 0;

function clampReplayBlockIndex(idx) {
  if (!Number.isFinite(idx)) return -1;
  return Math.max(0, Math.min(Math.trunc(idx), fullSequence.length - 1));
}

function clampReplayTransition(transition = 0) {
  if (!Number.isFinite(transition)) return 0;
  return Math.max(0, Math.min(transition, 0.999999));
}

function setReplayCursor(blockIdx = activeBlockIndex, transition = blockTransition) {
  activeBlockIndex = blockIdx < 0 ? -1 : clampReplayBlockIndex(blockIdx);
  blockTransition = clampReplayTransition(transition);
}

// Store original soma scale for pulse animation
const somaBaseScales = new Map();
somaMeshes.forEach((mesh, name) => {
  somaBaseScales.set(name, mesh.scale.x); // uniform scale
});

// Helper: get activation-based normalized value for a block at current timestep
function getBlockActivation(blockName) {
  if (!currentVizData || !currentTimestep) return 0;
  const blockData = currentVizData.blocks[currentTimestep];
  if (!blockData) return 0;
  const profileName = vizToProfileName(blockName);
  if (!profileName || !blockData[profileName]) return 0;
  const stats = blockData[profileName];
  const logNorm = stats.log_norm ?? Math.log1p(stats.norm ?? 0);
  const normBounds = currentVizData.normalization.per_step[currentTimestep]
    || currentVizData.normalization.global;
  const range = normBounds.p95 - normBounds.p5;
  const normalized = range > 0 ? (logNorm - normBounds.p5) / range : 0.5;
  return Math.max(0, Math.min(1, isFinite(normalized) ? normalized : 0));
}

function applySignalPulse(t) {
  if (activeBlockIndex < 0) return; // no replay active
  if (compareActive) return; // don't override diff coloring

  const activeBlockName = fullSequence[activeBlockIndex];

  // --- Skip connection activation ---
  skipMats.forEach(mat => {
    mat.emissiveIntensity = 0.08;
    mat.emissive.setHex(0x887040);
  });

  const skipRatios = currentVizData?.skip_ratios?.[currentTimestep];

  fullSequence.forEach((blockName, idx) => {
    const skipInfo = skipByDecoder.get(blockName);
    if (!skipInfo) return;

    const ratioData = skipRatios?.[blockName];
    const ratio = ratioData?.skip_ratio ?? 0.5;
    const ratioMul = 0.3 + 0.7 * ratio;

    if (idx === activeBlockIndex) {
      const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 4);
      skipInfo.mat.emissive.setHex(0xe8bd73);
      skipInfo.mat.emissiveIntensity = (0.8 + pulse * 0.6) * ratioMul;
    } else if (idx < activeBlockIndex) {
      const distance = activeBlockIndex - idx;
      if (distance <= TRAIL_DEPTH) {
        const trailT = distance / TRAIL_DEPTH;
        skipInfo.mat.emissive.setHex(0xc8a060);
        skipInfo.mat.emissiveIntensity = Math.max(0.08, 0.5 * (1 - trailT) * ratioMul);
      }
    }
  });

  // --- Cross-attention bezier flash during replay ---
  const isCrossAttn = CROSS_ATTN_BLOCKS.includes(activeBlockName);
  attnLines.forEach(({ material }, vizName) => {
    if (vizName === activeBlockName && isCrossAttn) {
      const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 4);
      material.opacity = 0.75 + pulse * 0.25;
      material.color.setHex(0xf0c050);
    } else {
      // Completely hide non-active cross-attn curves during replay
      // (they span the entire scene and create phantom line artifacts)
      material.opacity = 0.0;
    }
  });

  // Prompt field: only visible when active block has cross-attention
  if (isCrossAttn) {
    const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 4);
    promptFieldMat.opacity = 0.5 + pulse * 0.3;
    promptFieldMat.color.setHex(0xf0d080);
    promptLbl.material.opacity = 0.3 + pulse * 0.15;
  } else {
    promptFieldMat.opacity = 0.0;
    promptLbl.material.opacity = 0.0;
  }

  // --- Cable signal flow (per-level) ---
  const blockInfo = blockLevelMap.get(activeBlockName);

  function setTubeProgress(mat, progress, progressOffset = 0.0) {
    const shader = mat.userData.shaderRef?.value;
    if (!shader) return;
    shader.uniforms.u_progress.value = progress;
    if (shader.uniforms.u_progressOffset) shader.uniforms.u_progressOffset.value = progressOffset;

    // Material emissive set to black + intensity 1.0.
    // All signal glow is added per-fragment in the shader via totalEmissiveRadiance.
    // emissiveIntensity must be 1.0 so the shader's contribution passes through unscaled.
    // Black base emissive means: zero glow unless the shader explicitly adds it.
    mat.emissive.setHex(0x000000);
    mat.emissiveIntensity = 1.0;
  }

  function setHeadActivation(mat, activation, color, blockStart = 0.0) {
    const shader = mat.userData.shaderRef?.value;
    if (!shader) return;
    if (shader.uniforms.u_headActivation) shader.uniforms.u_headActivation.value = activation;
    if (shader.uniforms.u_headColor && color) shader.uniforms.u_headColor.value.copy(color);
    if (shader.uniforms.u_blockStart) shader.uniforms.u_blockStart.value = blockStart;
    // Head coloring is handled in the shader via u_headColor + u_headActivation.
    // No material-level emissive change — would light the whole tube uniformly.
  }

  // Level-progress variables — hoisted for use by both strand and soma sections
  const WAVE_SPREAD_BLOCKS = 0.35;
  let localProgress = 0;
  let waveSpreadProgress = 0;
  let currentLevelIdx = -1;

  if (blockInfo) {
    currentLevelIdx = levelOrder.indexOf(blockInfo.levelKey);
    // Each block gets an equal slice of tube progress (1/totalBlocks).
    // Last block animates from (N-1)/N → 1.0 instead of starting at 1.0.
    localProgress = (blockInfo.localIndex + blockTransition) / blockInfo.localTotal;

    // Set per-level tube progress + reset head activation on non-active levels
    // WAVE_SPREAD_BLOCKS: stagger in BLOCK units (consistent visual lag regardless of level size)
    // Divided by localTotal to convert to level-progress fraction.
    // 0.35 blocks ≈ "last strand lights 0.35 blocks after first strand" at any level.
    waveSpreadProgress = WAVE_SPREAD_BLOCKS / Math.max(1, blockInfo.localTotal);

    levelOrder.forEach((key, i) => {
      const lt = levelTubes[key];
      if (!lt) return;

      if (i < currentLevelIdx) {
        // === Bug 1+6 fix: Preceding level — smooth ramp instead of snap ===
        // When we just crossed a level boundary (first block of new level),
        // the previous level's trailing strands haven't finished yet.
        // Gradually ramp their offsets to 0 so they complete smoothly.
        const prevLevelBlocks = levelBlockNames[key]?.length || 1;
        const prevWaveSpread = WAVE_SPREAD_BLOCKS / Math.max(1, prevLevelBlocks);

        if (blockInfo.localIndex === 0 && i === currentLevelIdx - 1) {
          // First block of new level, immediately preceding level only —
          // ramp trailing strands to completion over first third of blockTransition
          const rampT = Math.min(1, blockTransition * 3);
          const residualSpread = prevWaveSpread * (1 - rampT);
          lt.mats.forEach((m, si) => {
            const offset = lt.mats.length > 1 ? (si / (lt.mats.length - 1)) * residualSpread : 0;
            setTubeProgress(m, 1.0, offset);
          });
        } else {
          // Fully settled (past first block, or 2+ levels behind) — no spread
          lt.mats.forEach(m => setTubeProgress(m, 1.0, 0.0));
        }

        // === Bug 3 fix: Gradual head activation on level crossing ===
        // Apply cached head activation from the LAST block in this level (exit state)
        // but scale it gradually during the first block of the new level.
        const levelBlocks = levelBlockNames[key];
        if (levelBlocks) {
          const lastBlock = levelBlocks[levelBlocks.length - 1];
          const cachedNorms = currentVizData?.blocks?.[currentTimestep]?.[vizToProfileName(lastBlock)]?.head_norms;
          if (cachedNorms && cachedNorms.length > 0) {
            // Only ramp the IMMEDIATELY preceding level; levels further back are already settled
            const activationScale = (blockInfo.localIndex === 0 && i === currentLevelIdx - 1)
              ? Math.min(1, blockTransition * 3) : 1.0;
            const minH = Math.min(...cachedNorms);
            const maxH = Math.max(...cachedNorms);
            const rangeH = maxH - minH;
            lt.mats.forEach((mat, si) => {
              if (si < cachedNorms.length) {
                const t = rangeH > 0 ? (cachedNorms[si] - minH) / rangeH : 0.5;
                const { color: headColor } = activationColor(t);
                const intensity = (0.3 + t * 0.7) * activationScale;
                setHeadActivation(mat, intensity, headColor);
              } else {
                setHeadActivation(mat, 0.0);
              }
            });
          } else {
            lt.mats.forEach(m => setHeadActivation(m, 0.0));
          }
        } else {
          lt.mats.forEach(m => setHeadActivation(m, 0.0));
        }

      } else if (i === currentLevelIdx) {
        // === Bug 6 fix: No clamp — pass localProgress directly ===
        // localProgress is (localIndex + blockTransition) / localTotal, naturally in [0, 1].
        // Removing the redundant Math.min(1, ...) ensures no precision artifacts.
        lt.mats.forEach((m, si) => {
          const offset = lt.mats.length > 1 ? (si / (lt.mats.length - 1)) * waveSpreadProgress : 0;
          setTubeProgress(m, localProgress, offset);
        });

      } else {
        // Following level: dark, reset offset
        lt.mats.forEach(m => { setTubeProgress(m, -1.0, 0.0); setHeadActivation(m, 0.0); });
      }
    });

    // === Transition tubes — late start with smooth handoff ===
    // afterLevel = source level (level "after which" this tube appears).
    // Transition starts late (92%) to avoid visual "jump ahead", but continues
    // smoothly into the first block of the incoming level via handoff.
    const TT_START = 0.92;  // transition tube starts when source level is 92% done
    const TT_WINDOW = 1.0 - TT_START;  // = 0.08

    transitionTubes.forEach(tt => {
      if (!tt.mats) return;
      const srcIdx = levelOrder.indexOf(tt.afterLevel);
      // Wave spread: use source level's block count (consistent with level tube wave spread)
      const srcLevelBlocks = levelBlockNames[tt.afterLevel]?.length || 1;
      // Cap wave spread to 90% of TT_WINDOW so last strand can still activate
      const ttWaveSpread = Math.min(WAVE_SPREAD_BLOCKS / Math.max(1, srcLevelBlocks), TT_WINDOW * 0.9);

      if (srcIdx < currentLevelIdx - 1) {
        // Both source and dest are behind current level — fully lit
        tt.mats.forEach(m => setTubeProgress(m, 1.0, 0.0));

      } else if (srcIdx === currentLevelIdx - 1) {
        // Transition leads INTO the current level (source is one level behind)
        if (blockInfo.localIndex === 0) {
          // First block of current level — complete remaining transition via handoff.
          // prevP = where each strand was at level boundary (localProgress=1.0 in source)
          tt.mats.forEach((m, si) => {
            const ttOffset = tt.mats.length > 1 ? (si / (tt.mats.length - 1)) * ttWaveSpread : 0;
            const prevP = (1.0 - ttOffset - TT_START) / TT_WINDOW;
            // Ramp from prevP to 1.0 over first 40% of blockTransition
            const rampT = Math.min(1, blockTransition / 0.4);
            const p = prevP + (1.0 - prevP) * rampT;
            setTubeProgress(m, Math.max(-1, Math.min(1, p)), 0.0);
          });
        } else {
          // Past first block — transition fully lit
          tt.mats.forEach(m => setTubeProgress(m, 1.0, 0.0));
        }

      } else if (srcIdx === currentLevelIdx) {
        // Current level is the source — animate when near end
        if (localProgress >= TT_START) {
          tt.mats.forEach((m, si) => {
            const ttOffset = tt.mats.length > 1 ? (si / (tt.mats.length - 1)) * ttWaveSpread : 0;
            const p = (localProgress - ttOffset - TT_START) / TT_WINDOW;
            setTubeProgress(m, Math.max(-1, Math.min(1, p)), 0.0);
          });
        } else {
          tt.mats.forEach(m => setTubeProgress(m, -1.0, 0.0));
        }

      } else {
        // Source is ahead of current level — dark
        tt.mats.forEach(m => setTubeProgress(m, -1.0, 0.0));
      }
    });

    // --- Per-head activation coloring ---
    // Each strand (= 1 attention head) gets colored AND intensity-scaled by its head_norms value.
    // Hot heads are bright and warm, cold heads are dim and cool.
    // Head color is confined to the current block's tube segment via u_blockStart shader uniform.
    const headNorms = currentVizData?.blocks?.[currentTimestep]?.[vizToProfileName(activeBlockName)]?.head_norms;
    const blockStartProgress = blockInfo.localIndex / blockInfo.localTotal;

    if (headNorms && headNorms.length > 0) {
      const lt = levelTubes[blockInfo.levelKey];
      if (lt) {
        const minH = Math.min(...headNorms);
        const maxH = Math.max(...headNorms);
        const rangeH = maxH - minH;

        lt.mats.forEach((mat, i) => {
          if (i < headNorms.length) {
            const offset = lt.mats.length > 1 ? (i / (lt.mats.length - 1)) * waveSpreadProgress : 0;
            const strandProgress = localProgress - offset;

            // Gate: strand must have entered the current block's tube territory
            if (strandProgress < blockStartProgress) {
              setHeadActivation(mat, 0.0, null, blockStartProgress);
              return;
            }

            const t = rangeH > 0 ? (headNorms[i] - minH) / rangeH : 0.5;
            const { color: headColor } = activationColor(t);
            const intensity = 0.3 + t * 0.7;
            setHeadActivation(mat, intensity, headColor, blockStartProgress);
          } else {
            // Clear stale head activation on extra strands beyond headNorms array
            setHeadActivation(mat, 0.0, null, blockStartProgress);
          }
        });
      }
    } else {
      // Clear stale head activation when no headNorms data for this block
      const lt = levelTubes[blockInfo.levelKey];
      if (lt) {
        lt.mats.forEach(mat => setHeadActivation(mat, 0.0, null, blockStartProgress));
      }
    }
  }

  // --- Soma block coloring: data-driven with pulse overlay ---
  const blockData = currentVizData?.blocks?.[currentTimestep];
  const normBounds = currentVizData?.normalization?.per_step?.[currentTimestep]
    || currentVizData?.normalization?.global;
  const normP5 = normBounds?.p5 ?? 0;
  const normRange = (normBounds?.p95 ?? 1) - normP5;

  fullSequence.forEach((blockName, idx) => {
    const mesh = somaMeshes.get(blockName);
    if (!mesh) return;
    const baseScale = somaBaseScales.get(blockName) || 1;

    // Get this block's actual activation magnitude (0→1)
    const activation = getBlockActivation(blockName);
    const { color: actColor, emissiveIntensity: actEmissive } = activationColor(activation);

    // Scale by activation: hot blocks are visibly larger (1.0x → 1.6x)
    const actScale = 1.0 + activation * 0.6;

    // For blocks in the CURRENT level, use continuous strand progress
    // so blocks only light after all strands have reached them.
    const thisBlockInfo = blockLevelMap.get(blockName);
    const inCurrentLevel = blockInfo && thisBlockInfo &&
      thisBlockInfo.levelKey === blockInfo.levelKey;

    if (inCurrentLevel) {
      // Block position within the level tube (0→1)
      const blockPos = thisBlockInfo.localIndex / thisBlockInfo.localTotal;
      const blockEndPos = (thisBlockInfo.localIndex + 1) / thisBlockInfo.localTotal;
      // Trailing strand = last strand to arrive (accounts for wave spread)
      const trailingProgress = localProgress - waveSpreadProgress;

      if (trailingProgress >= blockEndPos) {
        // All strands have fully passed this block — visited state
        const distance = activeBlockIndex - idx;
        const trailT = Math.min(1, Math.max(0, distance) / TRAIL_DEPTH);
        mesh.material.color.copy(actColor);
        mesh.material.emissive.copy(EMISSIVE_HOT);
        mesh.material.emissiveIntensity = actEmissive * (0.15 + 0.85 * (1 - trailT));
        mesh.scale.setScalar(baseScale * actScale);

      } else if (trailingProgress >= blockPos) {
        // All strands have arrived — block is active, ramps up as signal passes through
        const segmentLen = blockEndPos - blockPos;
        const arrivalT = Math.max(0, Math.min(1, (trailingProgress - blockPos) / segmentLen));
        const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 4);

        mesh.material.color.copy(actColor).lerp(PULSE_COLOR, (0.15 + pulse * 0.25) * arrivalT);
        mesh.material.emissive.copy(EMISSIVE_HOT);
        mesh.material.emissiveIntensity = (Math.max(actEmissive, 0.5) + pulse * 0.8) * arrivalT;
        const throbAmount = 0.08 + activation * 0.15;
        mesh.scale.setScalar(baseScale * (1.0 + (actScale - 1.0) * arrivalT) * (1.0 + pulse * throbAmount * arrivalT));

      } else {
        // Signal hasn't reached this block — dim
        mesh.material.color.copy(DIM_COLOR);
        mesh.material.emissive.setHex(0x000000);
        mesh.material.emissiveIntensity = 0;
        mesh.scale.setScalar(baseScale);
      }

    } else if (blockInfo && thisBlockInfo) {
      // Block in a DIFFERENT level — use level comparison
      const thisLevelIdx = levelOrder.indexOf(thisBlockInfo.levelKey);

      if (thisLevelIdx >= 0 && thisLevelIdx < currentLevelIdx) {
        // Preceding level — fully visited, trail fade by distance
        const distance = activeBlockIndex - idx;
        const trailT = Math.min(1, Math.max(0, distance) / TRAIL_DEPTH);
        mesh.material.color.copy(actColor);
        mesh.material.emissive.copy(EMISSIVE_HOT);
        mesh.material.emissiveIntensity = actEmissive * (0.15 + 0.85 * (1 - trailT));
        mesh.scale.setScalar(baseScale * actScale);

      } else {
        // Following level — dim
        mesh.material.color.copy(DIM_COLOR);
        mesh.material.emissive.setHex(0x000000);
        mesh.material.emissiveIntensity = 0;
        mesh.scale.setScalar(baseScale);
      }

    } else {
      // Fallback (no blockInfo or block not in blockLevelMap)
      if (idx < activeBlockIndex) {
        const distance = activeBlockIndex - idx;
        const trailT = Math.min(1, distance / TRAIL_DEPTH);
        mesh.material.color.copy(actColor);
        mesh.material.emissive.copy(EMISSIVE_HOT);
        mesh.material.emissiveIntensity = actEmissive * (0.15 + 0.85 * (1 - trailT));
        mesh.scale.setScalar(baseScale * actScale);
      } else {
        mesh.material.color.copy(DIM_COLOR);
        mesh.material.emissive.setHex(0x000000);
        mesh.material.emissiveIntensity = 0;
        mesh.scale.setScalar(baseScale);
      }
    }
  });
}

function clearSignalPulse() {
  blockTransition = 0;
  _lastBlockImgKey = ''; // Reset per-block image tracking
  // Restore all blocks to their activation-colored state
  fullSequence.forEach(blockName => {
    const mesh = somaMeshes.get(blockName);
    if (!mesh) return;
    const baseScale = somaBaseScales.get(blockName) || 1;
    mesh.scale.setScalar(baseScale);
  });
  // Reset skip connections to baseline
  skipMats.forEach(mat => {
    mat.emissive.setHex(0x887040);
    mat.emissiveIntensity = 0.15;
  });
  // Reset cable signal flow on all per-strand mats (levelTubes + transitionTubes)
  function resetStrandMat(mat) {
    const shader = mat.userData.shaderRef?.value;
    if (!shader) return;
    if (shader.uniforms.u_progress) shader.uniforms.u_progress.value = -1.0;
    if (shader.uniforms.u_progressOffset) shader.uniforms.u_progressOffset.value = 0.0;
    if (shader.uniforms.u_headActivation) shader.uniforms.u_headActivation.value = 0.0;
    if (shader.uniforms.u_headColor) shader.uniforms.u_headColor.value.set(0.91, 0.74, 0.45);
    // Reset material-level emissive
    mat.emissive.setHex(0xe8bd73);
    mat.emissiveIntensity = 0.18;
  }
  Object.values(levelTubes).forEach(lt => lt.mats.forEach(resetStrandMat));
  transitionTubes.forEach(tt => { if (tt.mats) tt.mats.forEach(resetStrandMat); });
  // Reset prompt field to hidden resting state
  promptFieldMat.opacity = 0.0;
  promptFieldMat.color.setHex(0xc8a868);
  promptLbl.material.opacity = 0.0;
  // Reset cross-attention lines to data-driven state (all hidden by default)
  updateCrossAttention();
  updateBlockColors();
}

/**
 * Update the intermediate image panel to show per-block or per-sub-block
 * PCA activation image during replay, falling back to per-timestep images.
 *
 * blockName can be a canonical block ('input_blocks.4.1') or a sub-block
 * name ('input_blocks.4.1::sub02_self_attn_0'). Sub-block names use '::'
 * as separator; in filenames this becomes '__'.
 */
let _lastBlockImgKey = '';
function updateBlockImage(blockName) {
  if (!vizIndex || !currentProfileKey || !currentTimestep) return;

  const profile = vizIndex.profiles.find(p => p.key === currentProfileKey);
  if (!profile) return;

  const step = parseInt(currentTimestep);
  const imgKey = `${blockName}_${step}`;

  // Skip if already showing this image
  if (imgKey === _lastBlockImgKey) return;
  _lastBlockImgKey = imgKey;

  const stripBase = (path) => path ? DATA_BASE + path.replace(/^activation-mapping\//, '') : null;

  // Determine parent block and sub-op name for caption
  const isSubBlock = blockName.includes('::');
  let parentBlockName, subOpName, pcaBlockName;
  if (isSubBlock) {
    [parentBlockName, subOpName] = blockName.split('::');
    // Strip the 'sub##_' prefix for display: 'sub02_self_attn_0' → 'self_attn_0'
    subOpName = subOpName.replace(/^sub\d+_/, '');
    pcaBlockName = blockName; // sub-blocks already use profile names
  } else {
    // Map viz aliases to profile names for correct PCA filename lookup
    parentBlockName = vizToProfileName(blockName) || blockName;
    pcaBlockName = parentBlockName;
    subOpName = null;
  }

  // Try PCA per-block image first
  if (profile.has_pca && profile.images.pca_base && profile.images.pca_pattern) {
    // Sanitize: '.' → '_', '::' → '__'
    const safeName = pcaBlockName.replace(/::/g, '__').replace(/\./g, '_');
    const pcaFile = profile.images.pca_pattern
      .replace('{block}', safeName)
      .replace('{step:02d}', String(step).padStart(2, '0'));
    const pcaPath = stripBase(profile.images.pca_base + pcaFile);

    intermediateImg.src = pcaPath;
    intermediateImg.onload = () => { imagePanel.style.display = 'block'; };
    intermediateImg.onerror = () => {
      // Fall back to per-timestep intermediate image
      const tsPath = profile.images?.intermediates?.[currentTimestep];
      if (tsPath) {
        intermediateImg.src = stripBase(tsPath);
        intermediateImg.onload = () => { imagePanel.style.display = 'block'; };
        intermediateImg.onerror = () => { imagePanel.style.display = 'none'; };
      }
    };

    // Build caption
    const shortName = parentBlockName.split('.').slice(-2).join('.');
    const blockDef = blocks.find(b => b.name === parentBlockName);
    const chLabel = blockDef ? ` — ${blockDef.ch}ch` : '';
    if (subOpName) {
      imageCaption.textContent = `step ${step} — ${shortName} — ${subOpName}${chLabel}`;
    } else {
      imageCaption.textContent = `step ${step} — ${shortName}${chLabel}`;
    }
  } else {
    // No PCA data — show per-timestep image
    const tsPath = profile.images?.intermediates?.[currentTimestep];
    if (tsPath) {
      intermediateImg.src = stripBase(tsPath);
      intermediateImg.onload = () => { imagePanel.style.display = 'block'; };
      intermediateImg.onerror = () => { imagePanel.style.display = 'none'; };
      const shortName = parentBlockName.split('.').slice(-2).join('.');
      const blockDef = blocks.find(b => b.name === parentBlockName);
      const chLabel = blockDef ? ` — ${blockDef.ch}ch` : '';
      imageCaption.textContent = `step ${step} — ${shortName}${chLabel}`;
    }
  }

  // Draw head_norms bar chart (uses parent block for data lookup)
  drawHeadNormsChart(parentBlockName);
}

function drawHeadNormsChart(blockName) {
  const profileName = vizToProfileName(blockName);
  const headNorms = currentVizData?.blocks?.[currentTimestep]?.[profileName]?.head_norms;
  if (!headNorms || headNorms.length === 0) {
    headNormsChart.style.display = 'none';
    return;
  }

  const ctx = headNormsChart.getContext('2d');
  const w = headNormsChart.width;
  const h = headNormsChart.height;
  ctx.clearRect(0, 0, w, h);

  const minV = Math.min(...headNorms);
  const maxV = Math.max(...headNorms);
  const range = maxV - minV || 1;

  const barW = Math.max(2, (w - 4) / headNorms.length - 1);
  const gap = 1;
  const startX = (w - (barW + gap) * headNorms.length + gap) / 2;

  headNorms.forEach((v, i) => {
    const t = (v - minV) / range;
    const barH = Math.max(2, t * (h - 4));
    const x = startX + i * (barW + gap);
    const y = h - 2 - barH;

    // Color ramp: cold blue → hot red
    const r = Math.floor(t * 255);
    const g = Math.floor((1 - Math.abs(t - 0.5) * 2) * 180);
    const b = Math.floor((1 - t) * 255);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(x, y, barW, barH);
  });

  headNormsChart.style.display = 'block';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Play Loop — auto-advances signal through blocks or steps
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function advancePlay(t) {
  if (!isPlaying || !currentVizData) return;

  const elapsed = t - lastPlayTime;

  if (playMode === 'block') {
    // Smooth block advance: blockTransition ramps 0→1 per block, then snaps to next
    const transitionSpeed = playSpeed * 1.5; // blocks per second (smooth)
    blockTransition += elapsed * transitionSpeed;
    lastPlayTime = t;

    while (blockTransition >= 1.0) {
      const carryTransition = blockTransition - 1.0;
      const prevLevelKey = blockLevelMap.get(fullSequence[activeBlockIndex])?.levelKey;
      activeBlockIndex++;
      if (activeBlockIndex >= fullSequence.length) {
        // Reached end of step — advance to next diffusion step
        const steps = currentVizData.timesteps;
        const currentIdx = steps.indexOf(parseInt(currentTimestep));
        if (currentIdx < steps.length - 1) {
          currentTimestep = String(steps[currentIdx + 1]);
          updateBlockColors();
          updateCrossAttention();
          updateUI();
          setReplayCursor(0, 0);
          updateBlockImage(fullSequence[0]);
        } else {
          // Replay finished: clamp to last block so applySignalPulse still has valid blockInfo
          setReplayCursor(fullSequence.length - 1, 0);
          isPlaying = false;
          updatePlayButton();
          break; // exit while loop — replay is done
        }
      } else {
        blockTransition = carryTransition;
      }
      // Update per-block image on block change (skip if sub-blocks will handle it)
      if (activeBlockIndex >= 0 && activeBlockIndex < fullSequence.length) {
        const _vizName = fullSequence[activeBlockIndex];
        const _profName = vizToProfileName(_vizName);
        const _hasSubs = currentVizData.sub_blocks?.[_profName]?.length > 0;
        if (!_hasSubs) {
          updateBlockImage(_vizName);
        }
      }
      updateBlockSlider();
      // Break at level boundaries so applySignalPulse sees the first block of new level cleanly
      const newLevelKey = blockLevelMap.get(fullSequence[activeBlockIndex])?.levelKey;
      if (newLevelKey !== prevLevelKey) break;
    }
    // Safety: ensure blockTransition stays in [0, 1) after boundary breaks
    if (blockTransition >= 1.0) blockTransition = blockTransition % 1.0;

    // Sub-block image cycling: during smooth 0→1 transition within a block,
    // cycle through sub-block PCA images proportionally.
    // blockTransition 0→1 maps to subBlocks[0] through subBlocks[N-1].
    if (activeBlockIndex >= 0 && activeBlockIndex < fullSequence.length && currentVizData.sub_blocks) {
      const vizBlockName = fullSequence[activeBlockIndex];
      const profileName = vizToProfileName(vizBlockName);
      const subBlocks = currentVizData.sub_blocks[profileName];
      if (subBlocks && subBlocks.length > 0) {
        const subIdx = Math.min(
          Math.floor(blockTransition * subBlocks.length),
          subBlocks.length - 1
        );
        updateBlockImage(subBlocks[subIdx]);
      }
    }
  } else if (playMode === 'step') {
    const interval = 1.0 / playSpeed;
    if (elapsed >= interval) {
      lastPlayTime = t;
      const steps = currentVizData.timesteps;
      const currentIdx = steps.indexOf(parseInt(currentTimestep));
      if (currentIdx < steps.length - 1) {
        currentTimestep = String(steps[currentIdx + 1]);
        updateBlockColors();
        updateCrossAttention();
        updateUI();
      } else {
        isPlaying = false;
        updatePlayButton();
      }
    }
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Raycaster + Block Selection + Click Detection
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let selectedBlockName = null;

// Build reverse map: mesh → block name
const meshToBlock = new Map();
somaMeshes.forEach((mesh, name) => { meshToBlock.set(mesh, name); });

// Drag detection — only fire click on static pointer (no orbit drag)
let pointerDownPos = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownPos = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownPos) return;
  const dx = Math.abs(e.clientX - pointerDownPos.x);
  const dy = Math.abs(e.clientY - pointerDownPos.y);
  if (dx < 4 && dy < 4) {
    handleSceneClick(e);
  }
  pointerDownPos = null;
});

function handleSceneClick(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const somaArray = Array.from(somaMeshes.values());
  const intersects = raycaster.intersectObjects(somaArray);

  if (intersects.length > 0) {
    const hitMesh = intersects[0].object;
    const blockName = meshToBlock.get(hitMesh);
    if (blockName) {
      selectBlock(blockName);
    }
  } else {
    deselectBlock();
  }
}

// Expose raycaster + click internals for debug
window._vizDebug.raycaster = raycaster;
window._vizDebug.meshToBlock = meshToBlock;
// interventionQueue and compareActive are bound later (defined further down).

function selectBlock(blockName) {
  selectedBlockName = blockName;
  updateDetailPanel();
  document.getElementById('block-detail-panel').style.display = 'block';
  if (typeof updateInterventionChannels === 'function') updateInterventionChannels();
  // Phase B: 3D block expansion
  if (typeof expandBlock === 'function') expandBlock(blockName);
  // Phase E: PCA brain scan
  if (typeof showPcaBrainScan === 'function') showPcaBrainScan(blockName);
}

function deselectBlock() {
  // Phase B: collapse 3D expansion
  if (typeof collapseBlock === 'function') collapseBlock();
  // Phase E: hide PCA brain scan
  if (typeof hidePcaBrainScan === 'function') hidePcaBrainScan();
  selectedBlockName = null;
  document.getElementById('block-detail-panel').style.display = 'none';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Block Detail Panel
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function updateDetailPanel() {
  if (!selectedBlockName) return;

  const block = blocks.find(b => b.name === selectedBlockName);
  if (!block) return;

  document.getElementById('detail-block-name').textContent = selectedBlockName;
  document.getElementById('detail-type').textContent = block.label;
  document.getElementById('detail-channels').textContent = `${block.ch}ch \u00b7 ${block.res}`;

  // Stats section
  const statsEl = document.getElementById('detail-stats');
  const profileName = vizToProfileName(selectedBlockName);
  const blockData = currentVizData?.blocks?.[currentTimestep];
  const stats = profileName && blockData ? blockData[profileName] : null;

  if (stats) {
    const normBounds = currentVizData.normalization.per_step[currentTimestep]
      || currentVizData.normalization.global;
    const logNorm = stats.log_norm ?? Math.log1p(stats.norm ?? 0);
    const normalized = (normBounds.p95 - normBounds.p5) > 0
      ? (logNorm - normBounds.p5) / (normBounds.p95 - normBounds.p5) : 0.5;
    const clamped = Math.max(0, Math.min(1, isFinite(normalized) ? normalized : 0));

    const fmt = (v, d) => (typeof v === 'number' && isFinite(v)) ? v.toFixed(d) : '\u2014';
    let html = `
      <div class="detail-section-label">ACTIVATION \u00b7 STEP ${currentTimestep}</div>
      <div class="detail-stat-row"><span>Norm</span><span class="detail-stat-value">${fmt(stats.norm, 1)} (${(clamped * 100).toFixed(0)}%)</span></div>
      <div class="detail-stat-row"><span>Mean</span><span class="detail-stat-value">${fmt(stats.mean, 4)}</span></div>
      <div class="detail-stat-row"><span>Std</span><span class="detail-stat-value">${fmt(stats.std, 4)}</span></div>
      <div class="detail-stat-row"><span>Max</span><span class="detail-stat-value">${fmt(stats.max, 3)}</span></div>
    `;
    // Phase A: Residual magnitude
    if (stats.residual_magnitude != null) {
      const rm = stats.residual_magnitude;
      const rmLabel = rm < 0.1 ? 'pass-through' : rm > 0.5 ? 'heavy' : 'moderate';
      html += `<div class="detail-stat-row"><span>Residual</span><span class="detail-stat-value">${fmt(rm, 3)} (${rmLabel})</span></div>`;
    }
    // Phase A: CFG split
    if (stats.cond_norm != null) {
      html += `
        <div class="detail-section-label" style="margin-top:6px;">CFG SPLIT</div>
        <div class="detail-stat-row"><span>Cond</span><span class="detail-stat-value">${fmt(stats.cond_norm, 1)}</span></div>
        <div class="detail-stat-row"><span>Uncond</span><span class="detail-stat-value">${fmt(stats.uncond_norm, 1)}</span></div>
        <div class="detail-stat-row"><span>Divergence</span><span class="detail-stat-value">${fmt(stats.cfg_divergence, 1)}</span></div>
      `;
    }
    // Phase A: Skip ratio (look up from top-level skip_ratios)
    const skipData = currentVizData?.skip_ratios?.[currentTimestep];
    if (skipData) {
      // Skip ratios are keyed by wrapper name (e.g., "output_blocks.0")
      const wrapperName = profileName?.split('.').slice(0, 2).join('.');
      const skipStats = skipData[wrapperName];
      if (skipStats) {
        html += `
          <div class="detail-section-label" style="margin-top:6px;">SKIP MIXING</div>
          <div class="detail-stat-row"><span>Skip ratio</span><span class="detail-stat-value">${fmt(skipStats.skip_ratio, 3)}</span></div>
          <div class="detail-stat-row"><span>Main norm</span><span class="detail-stat-value">${fmt(skipStats.main_norm, 1)}</span></div>
          <div class="detail-stat-row"><span>Skip norm</span><span class="detail-stat-value">${fmt(skipStats.skip_norm, 1)}</span></div>
        `;
      }
    }
    statsEl.innerHTML = html;
  } else {
    statsEl.innerHTML = `<div class="detail-section-label">ACTIVATION</div>
      <div style="font-size:8px;color:rgba(0,0,0,0.25);">No data for this block</div>`;
  }

  // Cross-attention
  const crossEl = document.getElementById('detail-cross-attn');
  const hasCrossAttn = CROSS_ATTN_BLOCKS.includes(selectedBlockName);
  if (hasCrossAttn) {
    const attnData = currentVizData?.attn_summaries?.[currentTimestep];
    const attnStats = attnData ? attnData[profileName] : null;
    const norm = attnStats?.output_norm;
    crossEl.innerHTML = `<span class="cross-attn-active">\u2737 Cross-attention active</span>` +
      (norm != null ? `<br>Output norm: ${norm.toFixed(1)}` : '');
  } else {
    crossEl.innerHTML = `<span style="color:rgba(0,0,0,0.2);">No cross-attention</span>`;
  }

  // Channel groups
  updateChannelGroups();

  // Annotations for this block
  updateDetailAnnotations();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Channel Group Display (Progressive Disclosure)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const fullProfileCache = new Map(); // profileKey → full profile data
const fullProfileFailed = new Set(); // negative cache for failed loads
let fullProfileAbort = null; // current AbortController
let fullProfileAbortKey = null; // key of in-flight fetch
const FULL_PROFILE_CACHE_MAX = 4;

async function loadFullProfile(profileKey) {
  if (fullProfileCache.has(profileKey)) {
    // LRU refresh: delete and re-set to move to end of Map iteration order
    const data = fullProfileCache.get(profileKey);
    fullProfileCache.delete(profileKey);
    fullProfileCache.set(profileKey, data);
    return data;
  }
  if (fullProfileFailed.has(profileKey)) return null;

  // If already fetching the same key, don't duplicate — return a promise that waits for it
  if (fullProfileAbort && fullProfileAbortKey === profileKey) {
    return new Promise(resolve => {
      const check = () => {
        if (fullProfileCache.has(profileKey)) resolve(fullProfileCache.get(profileKey));
        else if (fullProfileFailed.has(profileKey) || !fullProfileAbort) resolve(null);
        else setTimeout(check, 100);
      };
      check();
    });
  }

  // Cancel any in-flight fetch for a different profile
  if (fullProfileAbort) { fullProfileAbort.abort(); fullProfileAbort = null; }

  const controller = new AbortController();
  fullProfileAbort = controller;
  fullProfileAbortKey = profileKey;

  const baseName = 'baseline_' + profileKey;
  const url = DATA_BASE + `profiles/${baseName}.json`;

  try {
    const resp = await fetch(url, { signal: controller.signal });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    // LRU eviction — keep cache bounded
    if (fullProfileCache.size >= FULL_PROFILE_CACHE_MAX) {
      const oldest = fullProfileCache.keys().next().value;
      fullProfileCache.delete(oldest);
    }
    fullProfileCache.set(profileKey, data);
    return data;
  } catch (e) {
    if (e.name === 'AbortError') return null; // cancelled, not a failure
    console.warn('Could not load full profile:', e.message);
    fullProfileFailed.add(profileKey);
    return null;
  } finally {
    if (fullProfileAbort === controller) { fullProfileAbort = null; fullProfileAbortKey = null; }
  }
}

const CHANNEL_GROUP_SIZE = 32;

function updateChannelGroups() {
  const container = document.getElementById('channel-groups');
  const section = document.getElementById('detail-channel-section');
  const detailRow = document.getElementById('channel-detail-row');

  if (!selectedBlockName || !currentProfileKey || !currentTimestep) {
    section.style.display = 'none';
    return;
  }

  const profileName = vizToProfileName(selectedBlockName);
  if (!profileName) {
    section.style.display = 'none';
    return;
  }

  const block = blocks.find(b => b.name === selectedBlockName);
  if (!block) { section.style.display = 'none'; return; }

  // Try to get channel data from full profile
  const fullProfile = fullProfileCache.get(currentProfileKey);
  const channelNorms = fullProfile?.[currentTimestep]?.[profileName]?.channel_norms;

  if (!channelNorms) {
    // No channel data — show placeholder and trigger load
    section.style.display = 'block';
    const numGroups = Math.ceil(block.ch / CHANNEL_GROUP_SIZE);
    container.innerHTML = Array(numGroups).fill(0).map(() =>
      `<div class="ch-group-cell" style="background:rgba(0,0,0,0.08);"></div>`
    ).join('');
    detailRow.textContent = 'Loading channel data...';

    // Trigger background load (with stale-check on completion)
    const loadKey = currentProfileKey;
    loadFullProfile(loadKey).then(() => {
      if (currentProfileKey === loadKey && selectedBlockName) updateChannelGroups();
    });
    return;
  }

  // Compute channel group aggregates
  section.style.display = 'block';
  const numChannels = channelNorms.length;
  const numGroups = Math.ceil(numChannels / CHANNEL_GROUP_SIZE);
  const groupNorms = [];

  for (let g = 0; g < numGroups; g++) {
    const start = g * CHANNEL_GROUP_SIZE;
    const end = Math.min(start + CHANNEL_GROUP_SIZE, numChannels);
    let sum = 0;
    for (let i = start; i < end; i++) sum += channelNorms[i];
    groupNorms.push(sum / (end - start));
  }

  // Normalize group norms for coloring
  const minN = Math.min(...groupNorms);
  const maxN = Math.max(...groupNorms);
  const rangeN = maxN - minN;

  container.innerHTML = groupNorms.map((norm, g) => {
    const t = rangeN > 0 ? (norm - minN) / rangeN : 0.5;
    const r = Math.round(80 + t * (232 - 80));
    const green = Math.round(88 + t * (189 - 88));
    const b = Math.round(104 + t * (115 - 104));
    const start = g * CHANNEL_GROUP_SIZE;
    const end = Math.min(start + CHANNEL_GROUP_SIZE, numChannels);
    return `<div class="ch-group-cell" data-group="${g}"
      style="background:rgb(${r},${green},${b});"
      title="ch ${start}-${end - 1}: ${norm.toFixed(1)}"></div>`;
  }).join('');

  detailRow.textContent = `${numGroups} groups \u00d7 ${CHANNEL_GROUP_SIZE}ch`;

  // Click on channel group to show detail
  container.querySelectorAll('.ch-group-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const g = parseInt(cell.dataset.group);
      const start = g * CHANNEL_GROUP_SIZE;
      const end = Math.min(start + CHANNEL_GROUP_SIZE, numChannels);
      const groupData = channelNorms.slice(start, end);
      const maxCh = Math.max(...groupData);
      const minCh = Math.min(...groupData);
      const topIdx = groupData.indexOf(maxCh);
      detailRow.textContent = `ch ${start}-${end - 1}: avg ${(groupData.reduce((a, b) => a + b, 0) / groupData.length).toFixed(1)}, peak ch${start + topIdx} (${maxCh.toFixed(1)})`;
    });
  });
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Phase B: 3D Block Expansion (Progressive Disclosure Level 1)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// Block type → channel group configuration
// Cross-attention blocks: groups = attention heads (channels / 64)
// ResBlocks: groups = GroupNorm groups (always 32)
// Downsample/Upsample: atomic (no sub-groups)
const CHANNEL_GROUP_CONFIGS = {
  // channel_count → { groups, channels_per_group, type }
  getConfig(block) {
    const isCrossAttn = CROSS_ATTN_BLOCKS.includes(block.name);
    if (block.isSample) return null; // downsample/upsample: atomic
    if (isCrossAttn) {
      const heads = Math.floor(block.ch / 64);
      return { groups: heads, chPerGroup: 64, type: 'attention_head' };
    }
    // ResBlock: 32 GN groups
    return { groups: 32, chPerGroup: Math.floor(block.ch / 32), type: 'gn_group' };
  }
};

let expandedBlock = null; // { name, instancedMesh, config, origOpacity, origScale }
const EXPANSION_SCALE = 1.5;
const SUB_NODE_RADIUS = 0.035;
const subNodeGeo = new THREE.SphereGeometry(SUB_NODE_RADIUS, 8, 6);

function expandBlock(blockName) {
  // Collapse any existing expansion first
  collapseBlock();

  const block = blocks.find(b => b.name === blockName);
  if (!block) return;

  const config = CHANNEL_GROUP_CONFIGS.getConfig(block);
  if (!config) return; // atomic blocks don't expand

  const somaMesh = somaMeshes.get(blockName);
  if (!somaMesh) return;

  const numGroups = config.groups;
  const pos = block.pos.clone();
  const somaRadius = (R[block.level] || R[2]) * 3.0;

  // Create InstancedMesh for sub-nodes
  // White base color so instance colors show through unmuted
  const subMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.55,
    metalness: 0.08,
    emissive: 0x000000,
    emissiveIntensity: 0.0,
  });

  const instancedMesh = new THREE.InstancedMesh(subNodeGeo, subMat, numGroups);
  const dummy = new THREE.Object3D();
  const ringRadius = somaRadius * EXPANSION_SCALE * 1.3;

  // Layout: ring around the soma (for <= 20 groups) or concentric rings (for 32 groups)
  if (numGroups <= 20) {
    // Single ring
    for (let i = 0; i < numGroups; i++) {
      const angle = (i / numGroups) * Math.PI * 2;
      dummy.position.set(
        pos.x + Math.cos(angle) * ringRadius,
        pos.y + Math.sin(angle) * ringRadius,
        pos.z
      );
      dummy.scale.setScalar(1.0);
      dummy.updateMatrix();
      instancedMesh.setMatrixAt(i, dummy.matrix);
    }
  } else {
    // Dual ring for 32 GN groups (16 inner, 16 outer)
    const innerCount = Math.ceil(numGroups / 2);
    const outerCount = numGroups - innerCount;
    for (let i = 0; i < innerCount; i++) {
      const angle = (i / innerCount) * Math.PI * 2;
      dummy.position.set(
        pos.x + Math.cos(angle) * ringRadius * 0.75,
        pos.y + Math.sin(angle) * ringRadius * 0.75,
        pos.z
      );
      dummy.scale.setScalar(0.8);
      dummy.updateMatrix();
      instancedMesh.setMatrixAt(i, dummy.matrix);
    }
    for (let i = 0; i < outerCount; i++) {
      const angle = (i / outerCount) * Math.PI * 2 + Math.PI / outerCount; // offset
      dummy.position.set(
        pos.x + Math.cos(angle) * ringRadius * 1.15,
        pos.y + Math.sin(angle) * ringRadius * 1.15,
        pos.z
      );
      dummy.scale.setScalar(0.8);
      dummy.updateMatrix();
      instancedMesh.setMatrixAt(innerCount + i, dummy.matrix);
    }
  }

  instancedMesh.instanceMatrix.needsUpdate = true;

  // Set instance colors (neutral grey initially, will be updated with data)
  instancedMesh.instanceColor = new THREE.InstancedBufferAttribute(
    new Float32Array(numGroups * 3), 3
  );
  const neutralColor = new THREE.Color(0x505868);
  for (let i = 0; i < numGroups; i++) {
    instancedMesh.setColorAt(i, neutralColor);
  }
  instancedMesh.instanceColor.needsUpdate = true;

  group.add(instancedMesh);

  // Fade soma to translucent and scale up
  const origOpacity = somaMesh.material.opacity;
  const origScale = somaMesh.scale.x;
  somaMesh.material.transparent = true;
  somaMesh.material.opacity = 0.25;
  somaMesh.scale.setScalar(origScale * EXPANSION_SCALE);

  expandedBlock = {
    name: blockName,
    instancedMesh,
    config,
    subMat,
    origOpacity,
    origScale,
    numGroups,
  };

  // Color sub-nodes with activation data
  updateExpansionColors();

  // Smooth camera focus on the expanded block
  animateCameraToBlock(block);
}

function collapseBlock() {
  if (!expandedBlock) return;

  // Remove instanced mesh
  group.remove(expandedBlock.instancedMesh);
  expandedBlock.instancedMesh.dispose();
  expandedBlock.subMat.dispose();

  // Restore soma
  const somaMesh = somaMeshes.get(expandedBlock.name);
  if (somaMesh) {
    somaMesh.material.opacity = expandedBlock.origOpacity;
    somaMesh.material.transparent = expandedBlock.origOpacity < 1.0;
    somaMesh.scale.setScalar(expandedBlock.origScale);
  }

  expandedBlock = null;
}

function updateExpansionColors() {
  if (!expandedBlock || !currentProfileKey || !currentTimestep) return;

  const fullProfile = fullProfileCache.get(currentProfileKey);
  const profileName = vizToProfileName(expandedBlock.name);
  const channelNorms = fullProfile?.[currentTimestep]?.[profileName]?.channel_norms;

  if (!channelNorms) {
    // Trigger load, will re-color when available
    loadFullProfile(currentProfileKey).then(() => updateExpansionColors());
    return;
  }

  const config = expandedBlock.config;
  const numGroups = expandedBlock.numGroups;

  // Compute per-group mean activation
  const groupMeans = [];
  for (let g = 0; g < numGroups; g++) {
    const start = g * config.chPerGroup;
    const end = Math.min(start + config.chPerGroup, channelNorms.length);
    let sum = 0;
    for (let i = start; i < end; i++) sum += channelNorms[i];
    groupMeans.push(sum / (end - start));
  }

  // Normalize for coloring
  const minN = Math.min(...groupMeans);
  const maxN = Math.max(...groupMeans);
  const rangeN = maxN - minN;

  const color = new THREE.Color();
  for (let g = 0; g < numGroups; g++) {
    const t = rangeN > 0 ? (groupMeans[g] - minN) / rangeN : 0.5;
    const { color: ac, emissiveIntensity } = activationColor(t);
    expandedBlock.instancedMesh.setColorAt(g, ac);
  }
  expandedBlock.instancedMesh.instanceColor.needsUpdate = true;
}

// Camera animation for zoom-to-block
let cameraAnimTarget = null;
let cameraAnimStart = null;
let cameraAnimDuration = 600; // ms
let cameraAnimStartPos = null;
let cameraAnimStartTarget = null;

function animateCameraToBlock(block) {
  const somaRadius = (R[block.level] || R[2]) * 3.0;
  const viewDist = somaRadius * EXPANSION_SCALE * 8;

  cameraAnimStartPos = camera.position.clone();
  cameraAnimStartTarget = controls.target.clone();
  cameraAnimTarget = {
    position: new THREE.Vector3(
      block.pos.x,
      block.pos.y,
      block.pos.z + viewDist
    ),
    target: block.pos.clone(),
  };
  cameraAnimStart = performance.now();
}

function updateCameraAnimation(now) {
  if (!cameraAnimTarget || !cameraAnimStart) return;

  const elapsed = now - cameraAnimStart;
  const t = Math.min(1, elapsed / cameraAnimDuration);
  const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; // ease in-out cubic

  camera.position.lerpVectors(cameraAnimStartPos, cameraAnimTarget.position, eased);
  controls.target.lerpVectors(cameraAnimStartTarget, cameraAnimTarget.target, eased);
  controls.update();

  if (t >= 1) {
    cameraAnimTarget = null;
    cameraAnimStart = null;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Phase E: PCA Brain Scan Image Display
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const pcaTextureCache = new Map();  // "profileKey/block_step" → THREE.Texture
let pcaSprite = null;  // current displayed PCA sprite

function getPcaImageUrl(profileKey, blockName, step) {
  const profileData = vizIndex?.profiles?.find(p => p.key === profileKey);
  if (!profileData?.has_pca) return null;
  const safeName = blockName.replace(/\./g, '_');
  const stepNum = parseInt(step);
  return `activation-mapping/images/pca/${profileKey}/pca_${safeName}_step${stepNum.toString().padStart(2, '0')}.png`;
}

function showPcaBrainScan(blockName) {
  hidePcaBrainScan();  // clean up previous
  if (!currentProfileKey || !currentTimestep) return;

  const url = getPcaImageUrl(currentProfileKey, blockName, currentTimestep);
  if (!url) return;

  const cacheKey = `${currentProfileKey}/${blockName}_${currentTimestep}`;
  const cached = pcaTextureCache.get(cacheKey);

  if (cached) {
    _displayPcaSprite(cached, blockName);
  } else {
    // Lazy load with texture loader
    const loader = new THREE.TextureLoader();
    loader.load(url, (texture) => {
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      pcaTextureCache.set(cacheKey, texture);
      // Only display if same block is still selected
      if (selectedBlockName === blockName) {
        _displayPcaSprite(texture, blockName);
      }
    }, undefined, () => {
      // Load failed — PCA image doesn't exist yet, silently ignore
    });
  }
}

function _displayPcaSprite(texture, blockName) {
  hidePcaBrainScan();
  const blockPos = posMap.get(blockName);
  if (!blockPos) return;

  const block = blocks.find(b => b.name === blockName);
  const level = block?.level || 2;
  const size = R[level] * 6;  // scale relative to block size

  const mat = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    opacity: 0.9,
    depthTest: false,
  });
  pcaSprite = new THREE.Sprite(mat);
  pcaSprite.scale.set(size, size * (texture.image.height / texture.image.width), 1);
  // Position: offset to the left of encoder blocks, right of decoder blocks
  const xOffset = blockPos.x < 0 ? -size * 0.8 : size * 0.8;
  pcaSprite.position.set(blockPos.x + xOffset, blockPos.y, blockPos.z + 1.5);
  pcaSprite.renderOrder = 998;
  group.add(pcaSprite);
}

function hidePcaBrainScan() {
  if (pcaSprite) {
    group.remove(pcaSprite);
    pcaSprite.material.dispose();
    pcaSprite = null;
  }
}

function updatePcaBrainScan() {
  if (selectedBlockName) {
    showPcaBrainScan(selectedBlockName);
  } else {
    hidePcaBrainScan();
  }
}

// Annotation Store (localStorage)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const ANNOTATION_KEY = 'unet-viz-annotations';
let annIdCounter = 0; // collision-safe counter

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function loadAnnotations() {
  try {
    const raw = localStorage.getItem(ANNOTATION_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch { return []; }
}

function saveAnnotations(annotations) {
  try {
    localStorage.setItem(ANNOTATION_KEY, JSON.stringify(annotations));
  } catch (e) {
    console.warn('Failed to save annotations:', e.message);
  }
  updateAnnotationCount();
  updateAnnotationMarkers();
}

function addAnnotation(block, timestep, profile, note, tags) {
  const annotations = loadAnnotations();
  annotations.push({
    id: 'ann_' + Date.now() + '_' + (annIdCounter++),
    block,
    timestep,
    profile,
    note,
    tags,
    created: new Date().toISOString(),
  });
  saveAnnotations(annotations);
  return annotations;
}

function deleteAnnotation(id) {
  const annotations = loadAnnotations().filter(a => a.id !== id);
  saveAnnotations(annotations);
  return annotations;
}

function getBlockAnnotations(blockName) {
  return loadAnnotations().filter(a => a.block === blockName);
}

function updateAnnotationCount() {
  const count = loadAnnotations().length;
  document.getElementById('annotation-list-toggle').textContent = `Notes (${count})`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Annotation Markers (3D indicators on annotated blocks)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const annotationRings = new Map(); // blockName → ring mesh

function updateAnnotationMarkers() {
  const annotations = loadAnnotations();
  const annotatedBlocks = new Set(annotations.map(a => a.block));

  // Remove old rings
  annotationRings.forEach((ring, name) => {
    if (!annotatedBlocks.has(name)) {
      group.remove(ring);
      ring.geometry.dispose();
      ring.material.dispose();
      annotationRings.delete(name);
    }
  });

  // Add new rings
  annotatedBlocks.forEach(blockName => {
    if (annotationRings.has(blockName)) return;
    const somaMesh = somaMeshes.get(blockName);
    if (!somaMesh) return;

    const block = blocks.find(b => b.name === blockName);
    const baseR = (R[block?.level] || R[2]) * 3.0;
    const ringGeo = new THREE.TorusGeometry(baseR * 1.4, 0.02, 8, 24);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xe8bd73,
      transparent: true,
      opacity: 0.5,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(somaMesh.position);
    ring.rotation.x = Math.PI / 2;
    annotationRings.set(blockName, ring);
    group.add(ring);
  });
}

const interventionQueue = [];

const interventionOpSelect = document.getElementById('intervention-op');

const interventionMag = document.getElementById('intervention-mag');

// Show/hide magnitude row based on operation
interventionOpSelect.addEventListener('change', () => {
  const op = interventionOpSelect.value;
  interventionMagRow.style.display = (op === 'amplify' || op === 'clamp') ? 'flex' : 'none';
});

// Update channel group options when block is selected
function updateInterventionChannels() {
  const block = blocks.find(b => b.name === selectedBlockName);
  if (!block) return;
  const ch = block.ch;
  const groupSize = 32;
  const groups = Math.ceil(ch / groupSize);

  interventionChannels.innerHTML = '<option value="all">All</option>';
  for (let g = 0; g < groups; g++) {
    const start = g * groupSize;
    const end = Math.min(start + groupSize, ch) - 1;
    const opt = document.createElement('option');
    opt.value = `${start}-${end}`;
    opt.textContent = `ch ${start}-${end}`;
    interventionChannels.appendChild(opt);
  }
}

function resolveTimesteps() {
  const val = interventionSteps.value;
  if (val === 'all') return ['all'];
  if (val === 'current') return [parseInt(currentTimestep)];
  if (val === 'early') return Array.from({length: 7}, (_, i) => i + 1);
  if (val === 'late') return Array.from({length: 10}, (_, i) => i + 20);
  return ['all'];
}

function resolveChannels() {
  const val = interventionChannels.value;
  if (val === 'all') return 'all';
  const [start, end] = val.split('-').map(Number);
  return Array.from({length: end - start + 1}, (_, i) => start + i);
}

addInterventionBtn.addEventListener('click', () => {
  if (!selectedBlockName) return;

  const profileName = vizToProfileName(selectedBlockName) || selectedBlockName;
  const intervention = {
    block_name: profileName,
    channels: resolveChannels(),
    operation: interventionOpSelect.value,
    magnitude: parseFloat(interventionMag.value) || 0,
    timesteps: resolveTimesteps(),
  };

  interventionQueue.push(intervention);
  updateInterventionQueueUI();
});

function updateInterventionQueueUI() {
  const count = interventionQueue.length;
  iqToggle.textContent = `Interventions (${count})`;
  iqToggle.style.display = count > 0 ? 'block' : 'none';

  iqList.innerHTML = interventionQueue.map((iv, i) => {
    const chLabel = iv.channels === 'all' ? 'all ch' : `ch ${iv.channels[0]}-${iv.channels[iv.channels.length - 1]}`;
    const tsLabel = iv.timesteps[0] === 'all' ? 'all steps' : `steps ${iv.timesteps.join(',')}`;
    const magLabel = (iv.operation === 'amplify' || iv.operation === 'clamp') ? ` ×${iv.magnitude}` : '';
    return `<div class="iq-item">
      <span>${iv.block_name} · ${iv.operation}${magLabel} · ${chLabel} · ${tsLabel}</span>
      <span class="iq-remove" data-idx="${i}">&times;</span>
    </div>`;
  }).join('');

  iqList.querySelectorAll('.iq-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      interventionQueue.splice(parseInt(btn.dataset.idx), 1);
      updateInterventionQueueUI();
    });
  });
}

iqToggle.addEventListener('click', () => {
  iqPanel.style.display = iqPanel.style.display === 'none' ? 'block' : 'none';
});
iqClose.addEventListener('click', () => { iqPanel.style.display = 'none'; });

iqCopy.addEventListener('click', () => {
  const config = {
    description: `Intervention config from UNet Visualizer`,
    profile: currentProfileKey,
    interventions: interventionQueue.map(iv => ({...iv})),
  };
  const json = JSON.stringify(config, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    iqCopy.textContent = 'Copied!';
    setTimeout(() => { iqCopy.textContent = 'Copy Config'; }, 1500);
  }).catch(() => {
    // Fallback: select text in a temporary textarea
    const ta = document.createElement('textarea');
    ta.value = json;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    iqCopy.textContent = 'Copied!';
    setTimeout(() => { iqCopy.textContent = 'Copy Config'; }, 1500);
  });
});

iqClear.addEventListener('click', () => {
  interventionQueue.length = 0;
  updateInterventionQueueUI();
  iqPanel.style.display = 'none';
});

// ── Comparison Mode ──

let compareActive = false;
let compareVizDataB = null;
let compareProfileKeyB = null;

const compareToggle = document.getElementById('compare-toggle');
const comparePanel = document.getElementById('compare-panel');
const compareA = document.getElementById('compare-a');
const compareB = document.getElementById('compare-b');
const compareMode = document.getElementById('compare-mode');
const compareLoad = document.getElementById('compare-load');
const compareExit = document.getElementById('compare-exit');

// Populate comparison selects when profiles are loaded
function populateCompareSelects() {
  if (!vizIndex) return;
  [compareA, compareB].forEach(sel => {
    sel.innerHTML = '';
    vizIndex.profiles.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.key;
      opt.textContent = `${p.character} / ${p.pose}`;
      sel.appendChild(opt);
    });
  });
  // Default: A = current profile, B = different one
  compareA.value = currentProfileKey;
  const other = vizIndex.profiles.find(p => p.key !== currentProfileKey);
  if (other) compareB.value = other.key;
}

compareToggle.addEventListener('click', () => {
  if (comparePanel.style.display === 'none') {
    populateCompareSelects();
    comparePanel.style.display = 'block';
    compareToggle.classList.add('active');
  } else {
    comparePanel.style.display = 'none';
    compareToggle.classList.remove('active');
  }
});

compareLoad.addEventListener('click', async () => {
  const keyA = compareA.value;
  const keyB = compareB.value;

  if (keyA === keyB) return;

  // Load profile A (use current if matching)
  if (currentProfileKey !== keyA) {
    document.getElementById('profile-select').value = keyA;
    document.getElementById('profile-select').dispatchEvent(new Event('change'));
  }

  // Load profile B — use viz_json from index if available
  try {
    const profileB = vizIndex.profiles.find(p => p.key === keyB);
    const vizPath = profileB?.viz_json || `activation-mapping/profiles/viz/${keyB}.viz.json`;
    const stripBase = (path) => DATA_BASE + path.replace(/^activation-mapping\//, '');
    const resp = await fetch(stripBase(vizPath));
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    compareVizDataB = await resp.json();
    compareProfileKeyB = keyB;
    compareActive = true;

    // Show exit button, hide load
    compareLoad.style.display = 'none';
    compareExit.style.display = 'block';

    // Add second image panel for profile B
    addCompareImageB();

    // Update block colors to show difference
    updateCompareColors();
  } catch (e) {
    console.warn('Failed to load comparison profile:', e);
  }
});

compareExit.addEventListener('click', () => {
  compareActive = false;
  compareVizDataB = null;
  compareProfileKeyB = null;

  // Remove comparison image + label
  const imgB = document.getElementById('compare-image-b');
  if (imgB) imgB.remove();
  const labelB = document.getElementById('compare-image-b-label');
  if (labelB) labelB.remove();

  // Restore normal colors
  updateBlockColors();

  compareLoad.style.display = 'block';
  compareExit.style.display = 'none';
  comparePanel.style.display = 'none';
  compareToggle.classList.remove('active');
});

function addCompareImageB() {
  // Remove existing image + label
  let imgB = document.getElementById('compare-image-b');
  if (imgB) imgB.remove();
  let oldLabel = document.getElementById('compare-image-b-label');
  if (oldLabel) oldLabel.remove();

  if (!vizIndex || !compareProfileKeyB) return;

  const profile = vizIndex.profiles.find(p => p.key === compareProfileKeyB);
  if (!profile || !profile.has_intermediates) return;

  const stripBase = (path) => path ? DATA_BASE + path.replace(/^activation-mapping\//, '') : null;
  const rawPath = profile.images?.intermediates?.[currentTimestep];
  const imgPath = rawPath ? stripBase(rawPath) : null;

  if (imgPath) {
    imgB = document.createElement('img');
    imgB.id = 'compare-image-b';
    imgB.src = imgPath;
    imgB.style.width = '90px';
    imgB.style.height = Math.round(90 * 1216 / 832) + 'px';
    imgB.style.objectFit = 'cover';
    document.body.appendChild(imgB);

    // Label
    const label = document.createElement('div');
    label.id = 'compare-image-b-label';
    label.style.cssText = 'position:fixed;bottom:10px;right:28px;font-family:"DM Mono",monospace;font-size:7px;color:rgba(0,0,0,0.4);z-index:16;pointer-events:none;text-align:center;width:90px;';
    label.textContent = `${profile.character} / ${profile.pose}`;
    document.body.appendChild(label);
  }
}

function updateCompareImageB() {
  const imgB = document.getElementById('compare-image-b');
  if (!imgB || !vizIndex || !compareProfileKeyB) return;

  const profile = vizIndex.profiles.find(p => p.key === compareProfileKeyB);
  if (!profile) return;

  const stripBase = (path) => path ? DATA_BASE + path.replace(/^activation-mapping\//, '') : null;
  const rawPath = profile.images?.intermediates?.[currentTimestep];
  if (rawPath) imgB.src = stripBase(rawPath);
}

function updateCompareColors() {
  if (!compareActive || !currentVizData || !compareVizDataB) return;

  const mode = compareMode.value;
  const blockDataA = currentVizData.blocks?.[currentTimestep];
  const blockDataB = compareVizDataB.blocks?.[currentTimestep];

  if (!blockDataA || !blockDataB) {
    // Reset to neutral grey when data is missing for this timestep
    const neutralColor = new THREE.Color(0x808080);
    somaMeshes.forEach((mesh) => {
      mesh.material.color.copy(neutralColor);
      mesh.material.emissive.setHex(0x000000);
    });
    return;
  }

  // Collect differences
  const diffs = new Map();
  let maxAbsDiff = 0;

  somaMeshes.forEach((mesh, vizName) => {
    const profileName = vizToProfileName(vizName);
    if (!profileName) return;

    const a = blockDataA[profileName];
    const b = blockDataB[profileName];
    if (!a || !b) return;

    const logA = a.log_norm ?? Math.log1p(a.norm ?? 0);
    const logB = b.log_norm ?? Math.log1p(b.norm ?? 0);
    const diff = logA - logB;
    diffs.set(vizName, diff);
    maxAbsDiff = Math.max(maxAbsDiff, Math.abs(diff));
  });

  if (maxAbsDiff === 0) maxAbsDiff = 1;

  // Color: blue (B stronger) → neutral → red (A stronger)
  const coldColor = new THREE.Color(0x4080c0); // blue
  const neutralColor = new THREE.Color(0x808080); // grey
  const hotColor = new THREE.Color(0xc04040); // red

  somaMeshes.forEach((mesh, vizName) => {
    const diff = diffs.get(vizName);
    if (diff == null) {
      mesh.material.color.set(0x505868);
      mesh.material.emissive.setScalar(0);
      return;
    }

    const t = diff / maxAbsDiff; // -1 to 1
    const color = new THREE.Color();
    if (t >= 0) {
      color.lerpColors(neutralColor, hotColor, t);
    } else {
      color.lerpColors(neutralColor, coldColor, -t);
    }
    mesh.material.color.copy(color);
    mesh.material.emissive.copy(color).multiplyScalar(Math.abs(t) * 0.3);
  });
}

// Prevent compare panel events from reaching OrbitControls
['pointerdown', 'wheel'].forEach(evt => {
  comparePanel.addEventListener(evt, e => e.stopPropagation());
  compareToggle.addEventListener(evt, e => e.stopPropagation());
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Animation — breathing + skip emission pulse + signal flow
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function animate() {
  requestAnimationFrame(animate);
  const t = performance.now() / 1000;

  // Breathing: slow Y-scale oscillation
  group.scale.y = 1.0 + Math.sin(t * 2 * Math.PI / 10) * 0.005;

  // Skip emission pulse: decorative sine only when replay is NOT active
  // (when replay is active, applySignalPulse handles skip lighting)
  if (activeBlockIndex < 0) {
    skipMats.forEach((mat, i) => {
      const phase = (i / skipMats.length) * Math.PI * 2;
      mat.emissiveIntensity = 0.15 + 0.10 * Math.sin(t * 2 * Math.PI / 4 + phase);
    });
  }

  // Auto-advance play (BEFORE signal pulse so pulse uses current-frame state, not stale)
  advancePlay(t);

  // Signal pulse + trail when replay is active
  if (activeBlockIndex >= 0) {
    applySignalPulse(t);
  }

  // Camera animation (block expansion zoom)
  updateCameraAnimation(performance.now());

  controls.update();
  renderer.render(scene, camera);
}
animate();
